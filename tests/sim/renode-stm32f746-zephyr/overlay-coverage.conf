# Coverage overlay for Zephyr QEMU (mps2-an500) — applied via EXTRA_CONF_FILE
# by `ove test qemu-zephyr-coverage`.
#
# COVERAGE_GCOV enables Zephyr's custom gcov library; COVERAGE_SEMIHOST routes
# the gcda dump to real host files via the ARM semihosting trap (rather than
# the default console-dump + gen_gcov.py reconstruction path). Zephyr invokes
# gcov_coverage_semihost() automatically when main() returns
# (kernel/init.c:356-358), so no manual hook in our entry point is needed.
#
# The gcda filenames embedded in the .gcno files are absolute paths into the
# CMake build tree (Zephyr compiles from source locations, not with
# -fprofile-abs-path), so semihost_open writes .gcda alongside each .gcno
# under the build directory — exactly where `lcov --capture` expects them.
CONFIG_COVERAGE=y
CONFIG_COVERAGE_GCOV=y
CONFIG_SEMIHOST=y
CONFIG_COVERAGE_SEMIHOST=y
# The default 32KB is tight for our 30+ translation units; the largest .gcda
# we've seen from this test suite is ~4KB, but the dump keeps per-TU buffers
# live while copying. 65KB gives comfortable headroom.
CONFIG_COVERAGE_GCOV_HEAP_SIZE=65536
