CONFIG_MAIN_STACK_SIZE=16384
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y
# See zeroheap variant for rationale — same stack-overflow defenses applied
# here so the heap path is held to the same standard.
CONFIG_HW_STACK_PROTECTION=y
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_USE_PRINTK=y
# stm32f746g_disco has 320 KB SRAM total — leave headroom for stacks +
# stub_lvgl's static buffers.  Zephyr-QEMU/MPS2 can afford 1 MB; we can't.
CONFIG_HEAP_MEM_POOL_SIZE=131072
CONFIG_EVENTS=y
CONFIG_THREAD_CUSTOM_DATA=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
# Picolibc + POSIX file syscalls.  cmocka.c:2421-2477 (cmprintf_group_finish_xml)
# syntactically references fopen/fclose for JUnit XML output; symbols are link-
# time pulled regardless of runtime path, dragging picolibc tinystdio's fopen
# which needs open/read/write/close/lseek.  Zephyr's POSIX subsystem provides
# them (open/close/read/write under POSIX_DEVICE_IO; lseek under POSIX_FD_MGMT).
# Without CMOCKA_XML_FILE set in the env, cmocka's fp==NULL guard at
# cmocka.c:2447 skips XML emission gracefully.
CONFIG_PICOLIBC=y
CONFIG_PICOLIBC_USE_MODULE=y
CONFIG_PICOLIBC_IO_LONG_LONG=y
CONFIG_POSIX_SYSTEM_INTERFACES=y
CONFIG_POSIX_DEVICE_IO=y
CONFIG_POSIX_FD_MGMT=y
# POSIX_DEVICE_IO `select`s ZVFS_DEFAULT_FILE_VMETHODS, whose default vmethods
# call into Zephyr's filesystem subsys (fs_open/fs_read/fs_write/fs_seek/etc.).
# Enable FILE_SYSTEM to provide those symbols — no FS is mounted, so runtime
# fs_* calls return -ENOENT.  Cmocka's XML path never reaches them anyway
# (CMOCKA_XML_FILE not set), so this is a pure link-time fixup.
CONFIG_FILE_SYSTEM=y
# Semihosting — framework/semihosting_exit.h emits bkpt #0xab to signal
# end-of-test; CONFIG_SEMIHOST routes that through Renode's debug
# adapter.  Zephyr's stm32f746g_disco doesn't enable it by default.
CONFIG_SEMIHOST=y
