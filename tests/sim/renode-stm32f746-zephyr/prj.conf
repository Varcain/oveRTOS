CONFIG_MAIN_STACK_SIZE=16384
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y
# stm32f746g_disco has 320 KB SRAM total — leave headroom for stacks +
# stub_lvgl's static buffers.  Zephyr-QEMU/MPS2 can afford 1 MB; we can't.
CONFIG_HEAP_MEM_POOL_SIZE=131072
CONFIG_EVENTS=y
CONFIG_THREAD_CUSTOM_DATA=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=n
# Semihosting — framework/semihosting_exit.h emits bkpt #0xab to signal
# end-of-test; CONFIG_SEMIHOST routes that through Renode's debug
# adapter.  Zephyr's stm32f746g_disco doesn't enable it by default.
CONFIG_SEMIHOST=y
