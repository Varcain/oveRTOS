CONFIG_MAIN_STACK_SIZE=16384
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y
CONFIG_HEAP_MEM_POOL_SIZE=16384
# stm32f746g_disco's defconfig enables CONFIG_HW_STACK_PROTECTION via the
# MPU, but Zephyr's MPU programming for thread stacks under Renode 1.16's
# STM32F7 + ARM core combo trips a USAGE_FAULT (Illegal use of EPSR) on
# the first context switch back from k_sleep().  Heap-mode dodges it
# because dynamic threads pull stacks from the heap region rather than
# .bss-aligned static buffers.  Disable HW stack protection — we rely
# on CONFIG_STACK_SENTINEL for stack-overflow detection in tests.
CONFIG_HW_STACK_PROTECTION=n
CONFIG_STACK_SENTINEL=y
CONFIG_EVENTS=y
CONFIG_THREAD_CUSTOM_DATA=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=n
# Semihosting — see heap-variant prj.conf.
CONFIG_SEMIHOST=y
