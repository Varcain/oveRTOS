CONFIG_MAIN_STACK_SIZE=16384
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y
# DYNAMIC_THREAD lets ove_thread_create / ove_workqueue_create back their
# NULL-stack path (OVE_THREAD_STACK_BLOCK_STATIC_ on Zephyr) with
# k_thread_stack_alloc.  Application zero-heap means the application
# avoids malloc; the kernel still owns its stack pool, and the public
# create macros depend on it.  Without these the public API silently
# fails — exactly what test_public_create exists to catch.
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_HEAP_MEM_POOL_SIZE=16384
# Stack overflow detection — fail-fast on any thread that overruns its
# stack rather than wait for the corruption to surface as a fault later.
# HW_STACK_PROTECTION uses the MPU to guard the stack base; STACK_SENTINEL
# is the software backstop that also flags overruns on backends/configs
# where the MPU guard can't be programmed (kept on belt-and-braces).
# THREAD_ANALYZER prints high-water-mark per thread on test exit so a
# stack that gets close to overflow is visible even when it doesn't fault.
CONFIG_HW_STACK_PROTECTION=y
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_USE_PRINTK=y
CONFIG_EVENTS=y
CONFIG_THREAD_CUSTOM_DATA=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=n
# Semihosting — see heap-variant prj.conf.
CONFIG_SEMIHOST=y
