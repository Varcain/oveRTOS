CONFIG_MAIN_STACK_SIZE=16384
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y
# Truly static: kernel-side zero-heap config flows from prj.conf.j2 +
# OVE_THREAD_STACK_BLOCK_STATIC_ in backends/zephyr/include/ove_storage_zephyr.h
# (block-scope thread stacks are file-scope-static structs in __kstackmem
# — see backends/zephyr/zephyr_thread.c gating of k_thread_stack_alloc).
# Stack overflow detection — fail-fast on any thread that overruns its
# stack rather than wait for the corruption to surface as a fault later.
CONFIG_HW_STACK_PROTECTION=y
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_USE_PRINTK=y
CONFIG_EVENTS=y
CONFIG_THREAD_CUSTOM_DATA=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
# cmocka pulls in fopen/fdopen which picolibc tinystdio routes through
# read/write/open/close/lseek syscalls — bare-metal Zephyr doesn't
# provide those.  Override the template's picolibc selection back to
# newlib for test binaries; production zero-heap builds keep picolibc
# (verified via the benchmark on real STM32F746 hardware).
CONFIG_PICOLIBC=n
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=n
# Semihosting — see heap-variant prj.conf.
CONFIG_SEMIHOST=y
