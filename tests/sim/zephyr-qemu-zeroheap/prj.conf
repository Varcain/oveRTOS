CONFIG_MAIN_STACK_SIZE=16384
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y
# Public ove_thread_create / ove_workqueue_create on Zephyr fall back to
# k_thread_stack_alloc; that needs CONFIG_DYNAMIC_THREAD even in
# application-zero-heap mode (kernel keeps its own stack pool).
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_EVENTS=y
CONFIG_THREAD_CUSTOM_DATA=y
CONFIG_CONSOLE=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=n
# CONFIG_QEMU_TARGET is derived from board selection — do not set directly
