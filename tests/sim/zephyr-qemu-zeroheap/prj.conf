CONFIG_MAIN_STACK_SIZE=16384
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y
# Truly static: ove_thread_create / ove_workqueue_create now emit
# K_KERNEL_STACK-equivalent file-scope statics (see backends/zephyr/
# include/ove_storage_zephyr.h:OVE_THREAD_STACK_BLOCK_STATIC_), so
# CONFIG_DYNAMIC_THREAD / k_thread_stack_alloc are no longer required.
# CONFIG_HEAP_MEM_POOL_SIZE=0 and picolibc are emitted automatically
# by config/templates/prj.conf.j2 when CONFIG_OVE_ZERO_HEAP is set.
CONFIG_EVENTS=y
CONFIG_THREAD_CUSTOM_DATA=y
CONFIG_CONSOLE=y
# cmocka pulls in fopen/fdopen which picolibc tinystdio routes through
# POSIX syscalls bare-metal Zephyr doesn't provide.  Test fixtures
# stay on newlib; production zero-heap builds use picolibc (template).
CONFIG_PICOLIBC=n
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=n
# CONFIG_QEMU_TARGET is derived from board selection — do not set directly
