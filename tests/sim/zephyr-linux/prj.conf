# Zephyr config for the isolated Linux-personality USERSPACE bring-up. Built for
# mps2/an521/cpu0 (Cortex-M33) — Zephyr's mps2_an500 (Cortex-M7) has no MPU node
# in its devicetree, so ARCH_HAS_USERSPACE is off there; an521 supports it.
# CONFIG_USERSPACE gives unprivileged user threads + MPU memory domains — the
# substrate for running a loaded program unprivileged and trapping its svc
# cleanly (Zephyr context-switches via PendSV, so the SVC path is not entangled
# with the scheduler).
CONFIG_USERSPACE=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_THREAD_NAME=y
# z_do_kernel_oops()'s callee-saved-register argument (r7 = the Linux syscall
# number) is only populated with CONFIG_EXTRA_EXCEPTION_INFO on Armv7/8-M.
CONFIG_EXTRA_EXCEPTION_INFO=y
