# ============================================================================
# Zephyr bench (STM32F746/Cortex-M7) — same bench source as FreeRTOS/
# NuttX, only the wrappers' kernel-side internals differ (Zephyr uses
# k_mutex_*, k_sem_*, k_msgq_*, k_pipe_*, k_thread_*).  Run-trampoline
# shape and `ove_*` callee allow-list are identical to the other RTOSes.
# ============================================================================

stm32f746_zephyr_benchmark_c:
  symbols:
    # ─── Threading ─────────────────────────────────────────────
    - name: "thread_yield_run (C, Zephyr, ARM)"
      pattern: '^thread_yield_run$'
      max_instructions: 10
      allowed_calls: [ove_thread_yield]
      forbid_demangled: ["vtable for ", "typeinfo for ", "<dyn "]
    - name: "thread_sleep_1ms_run (C, Zephyr, ARM)"
      pattern: '^thread_sleep_1ms_run$'
      max_instructions: 12
      allowed_calls: [ove_thread_sleep_ms]
      forbid_demangled: ["vtable for ", "typeinfo for ", "<dyn "]
    - name: "thread_create_destroy_run (C, Zephyr, ARM)"
      pattern: '^thread_create_destroy_run$'
      max_instructions: 48
      # Zephyr toolchain emits a `memset` call to zero the on-stack
      # `struct ove_thread_desc` (compiler choice — FreeRTOS/NuttX
      # builds inline it).  Cold stack-zero helper, not wrapper code.
      allowed_calls: [ove_thread_create_, ove_thread_destroy, __stack_chk_fail, memset]
      forbid_demangled: ["vtable for ", "typeinfo for ", "<dyn "]
    - name: "ctx_switch_run (C, Zephyr, ARM)"
      pattern: '^ctx_switch_run$'
      max_instructions: 24
      allowed_calls: [ove_sem_give, ove_sem_take]
      forbid_demangled: ["vtable for ", "typeinfo for ", "<dyn "]
    # ─── Mutex ─────────────────────────────────────────────────
    - name: "mutex_lock_unlock_run (C, Zephyr, ARM)"
      pattern: '^mutex_lock_unlock_run$'
      max_instructions: 18
      allowed_calls: [ove_mutex_lock, ove_mutex_unlock]
      forbid_demangled: ["vtable for ", "typeinfo for ", "<dyn "]
    - name: "mutex_create_destroy_run (C, Zephyr, ARM)"
      pattern: '^mutex_create_destroy_run$'
      max_instructions: 20
      allowed_calls: [ove_mutex_create, ove_mutex_destroy, __stack_chk_fail]
      forbid_demangled: ["vtable for ", "typeinfo for ", "<dyn "]
    - name: "mutex_contention_run (C, Zephyr, ARM)"
      pattern: '^mutex_contention_run$'
      max_instructions: 24
      allowed_calls: [ove_mutex_lock, ove_mutex_unlock]
      forbid_demangled: ["vtable for ", "typeinfo for ", "<dyn "]
    - name: "rmtx_lock_unlock_run (C, Zephyr, ARM)"
      pattern: '^rmtx_lock_unlock_run$'
      max_instructions: 18
      allowed_calls: [ove_recursive_mutex_lock, ove_recursive_mutex_unlock]
      forbid_demangled: ["vtable for ", "typeinfo for ", "<dyn "]
    # ─── Semaphore ────────────────────────────────────────────
    - name: "sem_take_give_run (C, Zephyr, ARM)"
      pattern: '^sem_take_give_run$'
      max_instructions: 18
      allowed_calls: [ove_sem_take, ove_sem_give]
      forbid_demangled: ["vtable for ", "typeinfo for "]
    - name: "sem_create_destroy_run (C, Zephyr, ARM)"
      pattern: '^sem_create_destroy_run$'
      max_instructions: 20
      allowed_calls: [ove_sem_create, ove_sem_destroy, __stack_chk_fail]
      forbid_demangled: ["vtable for ", "typeinfo for "]
    # ─── Condvar / event ──────────────────────────────────────
    - name: "condvar_signal_wait_run (C, Zephyr, ARM)"
      pattern: '^condvar_signal_wait_run$'
      max_instructions: 28
      allowed_calls: [ove_mutex_lock, ove_mutex_unlock, ove_condvar_wait, ove_condvar_signal]
      forbid_demangled: ["vtable for ", "typeinfo for "]
    - name: "event_signal_wait_run (C, Zephyr, ARM)"
      pattern: '^event_signal_wait_run$'
      max_instructions: 16
      allowed_calls: [ove_event_wait, ove_event_signal]
      forbid_demangled: ["vtable for ", "typeinfo for "]
    # ─── IPC (queue / stream) ─────────────────────────────────
    - name: "queue_send_recv_run (C, Zephyr, ARM)"
      pattern: '^queue_send_recv_run$'
      max_instructions: 32
      allowed_calls: [ove_queue_send, ove_queue_receive, __stack_chk_fail]
      forbid_demangled: ["vtable for ", "typeinfo for "]
    - name: "queue_create_destroy_run (C, Zephyr, ARM)"
      pattern: '^queue_create_destroy_run$'
