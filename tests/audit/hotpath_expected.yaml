#
# Callee allowlists for the nightly STM32F746 FreeRTOS heap audit.
# Symbol and callee patterns are case-sensitive globs.
# Missing wrappers and unexpected callees fail the audit.

stm32f746_freertos_benchmark_c:
  symbols:
    - name: "mutex_lock_unlock_run (C, ARM)"
      pattern: 'mutex_lock_unlock_run'
      allowed_calls: [ove_mutex_lock, ove_mutex_unlock]

stm32f746_freertos_benchmark_cpp:
  symbols:
    # Mutex::lock and Semaphore::acquire abort on failed acquisition.
    - name: "mutex_lock_unlock trampoline (C++, ARM)"
      pattern: '_ZN5bench6detail14run_trampolineIL_ZL22mutex_lock_unlock_specEEEvPv'
      allowed_calls: [ove_mutex_lock, ove_mutex_unlock, abort]
    - name: "sem_take_give trampoline (C++, ARM)"
      pattern: '_ZN5bench6detail14run_trampolineIL_ZL18sem_take_give_specEEEvPv'
      allowed_calls: [ove_sem_take, ove_sem_give, abort]
    - name: "queue_send_recv trampoline (C++, ARM)"
      pattern: '_ZN5bench6detail14run_trampolineIL_ZL20queue_send_recv_specEEEvPv'
      allowed_calls: [ove_queue_send, ove_queue_receive, __stack_chk_fail]

stm32f746_freertos_benchmark_rust:
  symbols:
    # The scoped sync and queue APIs check execution context.
    - name: "Rust MUTEX_LOCK_UNLOCK::__run_tramp (ARM)"
      pattern: '_ZN*MUTEX_LOCK_UNLOCK11__run_tramp17h*E'
      allowed_calls:
        - ove_sync_context
        - ove_mutex_lock
        - ove_is_in_isr
        - ove_mutex_unlock
    - name: "Rust SEM_TAKE_GIVE::__run_tramp (ARM)"
      pattern: '_ZN*SEM_TAKE_GIVE11__run_tramp17h*E'
      allowed_calls:
        - ove_sync_context
        - ove_sem_take
        - ove_sem_give
    - name: "Rust EVENT_SIGNAL_WAIT::__run_tramp (ARM)"
      pattern: '_ZN*EVENT_SIGNAL_WAIT11__run_tramp17h*E'
      allowed_calls:
        - ove_sync_context
        - ove_event_wait
        - ove_is_in_isr
        - ove_event_signal_from_isr
        - ove_event_signal
    - name: "Rust QUEUE_SEND_RECEIVE::__run_tramp (ARM)"
      pattern: '_ZN*QUEUE_SEND_RECEIVE11__run_tramp17h*E'
      allowed_calls:
        - ove_sync_context
        - ove_queue_send
        - ove_queue_receive

stm32f746_freertos_benchmark_zig:
  symbols:
    - name: "Zig zig_bench_run_sync_mutex_lock_unlock (ARM)"
      pattern: 'zig_bench_run_sync_mutex_lock_unlock'
      allowed_calls:
        - ove_mutex_lock
        - ove_mutex_unlock
        - "debug.FullPanic*"
        - "debug.panic*"
    - name: "Zig zig_bench_run_sync_sem_take_give (ARM)"
      pattern: 'zig_bench_run_sync_sem_take_give'
      allowed_calls:
        - ove_sem_take
        - ove_sem_give
        - "debug.FullPanic*"
        - "debug.panic*"
    - name: "Zig zig_bench_run_queue_send_receive (ARM)"
      pattern: 'zig_bench_run_queue_send_receive'
      allowed_calls:
        - ove_queue_send
        - ove_queue_receive
        - "debug.FullPanic*"
        - "debug.panic*"
