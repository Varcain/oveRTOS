# ============================================================================
# Rust bench — symbol naming: _ZN<crate><CASE>11__run_tramp17h<hash>E
# OnceCell init guards add ~5 instructions over the equivalent C path;
# `core::result::unwrap_failed` is the panic path and is allow-listed
# but never reached on the happy path.  GOT-slot indirect calls are
# resolved by dump_hotpaths.py, so allowed_calls reads naturally.
# ============================================================================
host_posix_benchmark_rust:
  symbols:
    # ─── Threading ─────────────────────────────────────────────
    - name: "Rust THREAD_YIELD::__run_tramp"
      pattern: '_ZN.+THREAD_YIELD11__run_tramp17h[0-9a-f]+E$'
      max_instructions: 8
      allowed_calls: [ove_thread_yield]
      forbid_demangled: ["vtable for ", "typeinfo for ", "<dyn ", "core::panicking::"]
    - name: "Rust THREAD_SLEEP_1MS::__run_tramp"
      pattern: '_ZN.+THREAD_SLEEP_1MS11__run_tramp17h[0-9a-f]+E$'
      max_instructions: 8
      allowed_calls: [ove_thread_sleep_ms]
      forbid_demangled: ["vtable for ", "typeinfo for ", "<dyn ", "core::panicking::"]
    - name: "Rust THREAD_CREATE_DESTROY::__run_tramp"
      pattern: '_ZN.+THREAD_CREATE_DESTROY11__run_tramp17h[0-9a-f]+E$'
      max_instructions: 60
      # spawn() is the safe wrapper that ultimately calls ove_thread_create_;
      # destroy reaches ove_thread_destroy via Drop on the Thread handle.
      # `*` suffix matches any monomorphisation hash (rebuild-volatile).
      allowed_calls:
        - "_ZN3ove6thread6Thread5spawn17h*"
        - ove_thread_destroy
        - "_ZN4core6result13unwrap_failed17h*"
      forbid_demangled: ["vtable for ", "typeinfo for ", "<dyn ", "alloc::alloc::"]
    - name: "Rust THREAD_CTX_SWITCH::__run_tramp"
      pattern: '_ZN.+THREAD_CTX_SWITCH11__run_tramp17h[0-9a-f]+E$'
      max_instructions: 24
      allowed_calls:
        - ove_sem_give
        - ove_sem_take
        - "_ZN4core6result13unwrap_failed17h*"
      forbid_demangled: ["vtable for ", "typeinfo for ", "<dyn "]
    # ─── Mutex ─────────────────────────────────────────────────
    - name: "Rust MUTEX_LOCK_UNLOCK::__run_tramp"
      pattern: '_ZN.+MUTEX_LOCK_UNLOCK11__run_tramp17h[0-9a-f]+E$'
      max_instructions: 22
      allowed_calls: [ove_mutex_lock, ove_mutex_unlock]
      forbid_demangled: ["vtable for ", "typeinfo for ", "<dyn ", "core::panicking::", "alloc::alloc::"]
    - name: "Rust MUTEX_CREATE_DESTROY::__run_tramp"
      pattern: '_ZN.+MUTEX_CREATE_DESTROY11__run_tramp17h[0-9a-f]+E$'
      max_instructions: 36
      allowed_calls:
        - "_ZN3ove4sync5Mutex3new17h*"
        - ove_mutex_destroy
        - "_ZN4core6result13unwrap_failed17h*"
      forbid_demangled: ["vtable for ", "typeinfo for ", "<dyn ", "alloc::alloc::"]
    - name: "Rust MUTEX_CONTENTION_2T::__run_tramp"
      pattern: '_ZN.+MUTEX_CONTENTION_2T11__run_tramp17h[0-9a-f]+E$'
      max_instructions: 24
      allowed_calls:
        - ove_mutex_lock
        - ove_mutex_unlock
        - "_ZN4core6result13unwrap_failed17h*"
      forbid_demangled: ["vtable for ", "typeinfo for ", "<dyn ", "alloc::alloc::"]
    - name: "Rust RMTX_LOCK_UNLOCK::__run_tramp"
      pattern: '_ZN.+RMTX_LOCK_UNLOCK11__run_tramp17h[0-9a-f]+E$'
      max_instructions: 22
      allowed_calls: [ove_recursive_mutex_lock, ove_recursive_mutex_unlock]
      forbid_demangled: ["vtable for ", "typeinfo for ", "<dyn "]
    # ─── Semaphore ────────────────────────────────────────────
    - name: "Rust SEM_TAKE_GIVE::__run_tramp"
      pattern: '_ZN.+SEM_TAKE_GIVE11__run_tramp17h[0-9a-f]+E$'
      max_instructions: 22
      allowed_calls: [ove_sem_take, ove_sem_give]
      forbid_demangled: ["vtable for ", "typeinfo for ", "<dyn ", "core::panicking::", "alloc::alloc::"]
    - name: "Rust SEM_CREATE_DESTROY::__run_tramp"
      pattern: '_ZN.+SEM_CREATE_DESTROY11__run_tramp17h[0-9a-f]+E$'
      max_instructions: 36
      allowed_calls:
        - "_ZN3ove4sync9Semaphore3new17h*"
        - ove_sem_destroy
        - "_ZN4core6result13unwrap_failed17h*"
      forbid_demangled: ["vtable for ", "typeinfo for ", "<dyn "]
    # ─── Condvar / event ──────────────────────────────────────
    - name: "Rust CONDVAR_SIGNAL_WAIT::__run_tramp"
      pattern: '_ZN.+CONDVAR_SIGNAL_WAIT11__run_tramp17h[0-9a-f]+E$'
      max_instructions: 32
      allowed_calls:
        - ove_mutex_lock
        - ove_mutex_unlock
        - ove_condvar_wait
        - ove_condvar_signal
      forbid_demangled: ["vtable for ", "typeinfo for ", "<dyn "]
    - name: "Rust EVENT_SIGNAL_WAIT::__run_tramp"
      pattern: '_ZN.+EVENT_SIGNAL_WAIT11__run_tramp17h[0-9a-f]+E$'
      max_instructions: 20
      allowed_calls: [ove_event_wait, ove_event_signal]
      forbid_demangled: ["vtable for ", "typeinfo for ", "<dyn "]
    # ─── IPC (queue / stream) ─────────────────────────────────
    - name: "Rust QUEUE_SEND_RECEIVE::__run_tramp"
      pattern: '_ZN.+QUEUE_SEND_RECEIVE11__run_tramp17h[0-9a-f]+E$'
      max_instructions: 28
      allowed_calls: [ove_queue_send, ove_queue_receive]
      forbid_demangled: ["vtable for ", "typeinfo for ", "<dyn ", "alloc::alloc::"]
    - name: "Rust QUEUE_CREATE_DESTROY::__run_tramp"
      pattern: '_ZN.+QUEUE_CREATE_DESTROY11__run_tramp17h[0-9a-f]+E$'
      max_instructions: 36
      allowed_calls:
        - "_ZN3ove5queue18Queue$LT$T$C$_$GT$3new17h*"
        - ove_queue_destroy
        - "_ZN4core6result13unwrap_failed17h*"
      forbid_demangled: ["vtable for ", "typeinfo for ", "<dyn "]
    - name: "Rust STREAM_SEND_RECV_64B::__run_tramp"
      pattern: '_ZN.+STREAM_SEND_RECV_64B11__run_tramp17h[0-9a-f]+E$'
      max_instructions: 56
      allowed_calls:
        - "_ZN3ove11static_cell19StaticCell$LT$T$GT$3get17h*"
        - "_ZN3ove6stream15Stream$LT$_$GT$4send17h*"
        - "_ZN3ove6stream15Stream$LT$_$GT$7receive17h*"
        - ove_stream_send
        - ove_stream_receive
      forbid_demangled: ["vtable for ", "typeinfo for ", "<dyn "]

