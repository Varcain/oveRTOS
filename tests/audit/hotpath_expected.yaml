# This file is part of oveRTOS.
#
# Hotpath golden file for scripts/dump_hotpaths.py.  Companion to
# scripts/zero_overhead_audit.py.
#
# Covers every wrapper case that has a peer entry in
# scripts/bench_compare.py's wrapper-vs-native table — threading,
# mutex, semaphore, condvar/event, IPC.  Soft assertions:
#   - max_instructions: generous cap, set roughly 1.5–2× the current
#     measured count.  Compiler upgrades that shrink wrappers are
#     fine (tighten manually if desired); blowups are caught.
#
# Hard assertions:
#   - allowed_calls: list of permitted call/jmp targets.  Anything
#     outside this set fails the build.  GOT-slot indirect calls in
#     PIE binaries (Rust) are resolved to the underlying function name
#     by dump_hotpaths.py, so allowed_calls reads naturally.
#   - forbid_demangled: substrings that must NEVER appear in the
#     demangled symbol name (vtables, typeinfo, dyn-trait dispatch).
#
# Stack-canary `__stack_chk_fail@plt` and Rust panic-path
# `core::result::unwrap_failed` are linker-level safety nets that are
# never reached on the happy path; they must be allow-listed because
# the linker keeps them reachable from the bench setup/run code paths.
#
# Zig coverage uses stable suite-scoped exports (`zig_bench_run_<suite>_
# <case>`) emitted by `bench.caseAudited(suite, spec)` in
# `bindings/zig/ove/src/bench.zig`.  Without the explicit @export, Zig
# emits anonymous numbered trampolines (`bench.case.Tramps.runTramp.<N>`)
# whose ordering is rebuild-volatile — useless as audit targets.  The
# `caseAudited` helper aliases each trampoline to a deterministic
# symbol; main.zig opts cases in by calling `bench.caseAudited` instead
# of `bench.case`.
#
# `debug.FullPanic((function 'defaultPanic')).unwrapNull` is the Zig
# safety-check panic path emitted by `?T` unwrapping in setup paths
# (e.g. `&native_mtx`-style optional dereference).  Linker keeps it
# reachable; never reached on the happy path.

# ============================================================================
# C bench — symbol naming: <case>_run
# ============================================================================
host_posix_benchmark_c:
  symbols:
    # ─── Threading ─────────────────────────────────────────────
    - name: "thread_yield_run (C)"
      pattern: '^thread_yield_run$'
      max_instructions: 8
      allowed_calls: [ove_thread_yield]
      forbid_demangled: ["vtable for ", "typeinfo for ", "<dyn "]
    - name: "thread_sleep_1ms_run (C)"
      pattern: '^thread_sleep_1ms_run$'
      max_instructions: 8
      allowed_calls: [ove_thread_sleep_ms]
      forbid_demangled: ["vtable for ", "typeinfo for ", "<dyn "]
    - name: "thread_create_destroy_run (C)"
      pattern: '^thread_create_destroy_run$'
      max_instructions: 40
      allowed_calls: [ove_thread_create_, ove_thread_destroy, __stack_chk_fail@plt]
      forbid_demangled: ["vtable for ", "typeinfo for ", "<dyn "]
    - name: "ctx_switch_run (C)"
      pattern: '^ctx_switch_run$'
      max_instructions: 16
      allowed_calls: [ove_sem_give, ove_sem_take]
      forbid_demangled: ["vtable for ", "typeinfo for ", "<dyn "]
    # ─── Mutex ─────────────────────────────────────────────────
    - name: "mutex_lock_unlock_run (C)"
      pattern: '^mutex_lock_unlock_run$'
      max_instructions: 16
      allowed_calls: [ove_mutex_lock, ove_mutex_unlock]
      forbid_demangled: ["vtable for ", "typeinfo for ", "<dyn "]
    - name: "mutex_create_destroy_run (C)"
      pattern: '^mutex_create_destroy_run$'
      max_instructions: 28
      allowed_calls: [ove_mutex_create, ove_mutex_destroy, __stack_chk_fail@plt]
      forbid_demangled: ["vtable for ", "typeinfo for ", "<dyn "]
    - name: "mutex_contention_run (C)"
      pattern: '^mutex_contention_run$'
      max_instructions: 20
      allowed_calls: [ove_mutex_lock, ove_mutex_unlock]
      forbid_demangled: ["vtable for ", "typeinfo for ", "<dyn "]
    - name: "rmtx_lock_unlock_run (C)"
      pattern: '^rmtx_lock_unlock_run$'
      max_instructions: 16
      allowed_calls: [ove_recursive_mutex_lock, ove_recursive_mutex_unlock]
      forbid_demangled: ["vtable for ", "typeinfo for ", "<dyn "]
    # ─── Semaphore ────────────────────────────────────────────
    - name: "sem_take_give_run (C)"
      pattern: '^sem_take_give_run$'
      max_instructions: 16
      allowed_calls: [ove_sem_take, ove_sem_give]
      forbid_demangled: ["vtable for ", "typeinfo for "]
    - name: "sem_create_destroy_run (C)"
      pattern: '^sem_create_destroy_run$'
      max_instructions: 28
      allowed_calls: [ove_sem_create, ove_sem_destroy, __stack_chk_fail@plt]
      forbid_demangled: ["vtable for ", "typeinfo for "]
    # ─── Condvar / event ──────────────────────────────────────
    - name: "condvar_signal_wait_run (C)"
      pattern: '^condvar_signal_wait_run$'
      max_instructions: 20
      allowed_calls: [ove_mutex_lock, ove_mutex_unlock, ove_condvar_wait, ove_condvar_signal]
      forbid_demangled: ["vtable for ", "typeinfo for "]
    - name: "event_signal_wait_run (C)"
      pattern: '^event_signal_wait_run$'
      max_instructions: 12
      allowed_calls: [ove_event_wait, ove_event_signal]
      forbid_demangled: ["vtable for ", "typeinfo for "]
    # ─── IPC (queue / stream) ─────────────────────────────────
    - name: "queue_send_recv_run (C)"
      pattern: '^queue_send_recv_run$'
      max_instructions: 32
      allowed_calls: [ove_queue_send, ove_queue_receive, __stack_chk_fail@plt]
      forbid_demangled: ["vtable for ", "typeinfo for "]
    - name: "queue_create_destroy_run (C)"
      pattern: '^queue_create_destroy_run$'
      max_instructions: 28
      allowed_calls: [ove_queue_create, ove_queue_destroy, __stack_chk_fail@plt]
      forbid_demangled: ["vtable for ", "typeinfo for "]
    - name: "stream_send_recv_run (C)"
      pattern: '^stream_send_recv_run$'
      max_instructions: 40
      allowed_calls: [ove_stream_send, ove_stream_receive, __stack_chk_fail@plt]
      forbid_demangled: ["vtable for ", "typeinfo for "]

