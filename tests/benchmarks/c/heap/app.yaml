lang: c
config_name: benchmark_heap
description: "RTOS Abstraction Benchmark (heap mode)"
sources:
  - ../src/app.c
  - ../src/bench_harness.c
  - ../src/bench_output.c
  - ../src/bench_compute.c
  - ../src/bench_memory.c
  - ../src/bench_time.c
  - ../src/bench_thread.c
  - ../src/bench_sync.c
  - ../src/bench_queue.c
  - ../src/bench_timer.c
  - ../src/bench_eventgroup.c
  - ../src/bench_workqueue.c
  - ../src/bench_stream.c
  - ../src/bench_native_posix.c
  - ../src/bench_native_freertos.c
  - ../src/bench_native_nuttx.c
  - ../src/bench_native_zephyr.c
includes:
  - ../include
defconfig:
  - CONFIG_OVE_BSP=y
  - CONFIG_OVE_QUEUE=y
  - CONFIG_OVE_TIMER=y
  - CONFIG_OVE_EVENTGROUP=y
  - CONFIG_OVE_WORKQUEUE=y
  - CONFIG_OVE_STREAM=y
  - CONFIG_OVE_SIM_DASHBOARD=n
  # Disable observability hooks that add per-call overhead. Documented
  # in Config.in.debug as adding ~100ns per sync op for trace markers.
  # The minimal-overhead claim only holds with these off; bench numbers
  # would otherwise reflect tracing cost rather than the wrapper layer.
  - CONFIG_OVE_TRACE_MARKERS=n
  - CONFIG_OVE_TRACE_STREAM=n
  - CONFIG_OVE_THREAD_STATE_STATS=n
  # The sampling profiler is observability overhead too — off for the same
  # reason (measure the wrapper layer, not the profiler's exception-walk).
  - CONFIG_OVE_PROFILER=n
  # Worst-case timing: disable I-cache, D-cache, branch predictor, ART,
  # and flash prefetch on STM32F7 so published numbers approximate a
  # cacheless ARM MCU.  See docs-site/docs/benchmarks/index.md
  # ("Worst-case timing mode").  No-op on POSIX / sim builds.
  - CONFIG_OVE_BENCHMARK_WORST_CASE_TIMING=y
kconfig: |
  config OVE_BENCHMARK_ITERATIONS
  	int "Number of measurement iterations per benchmark case"
  	default 1000

  config OVE_BENCHMARK_WARMUP
  	int "Number of warmup iterations before measurement"
  	default 100

  config OVE_BENCHMARK_INCLUDE_MEMORY
  	bool "Include memory usage benchmarks"
  	default y

  config OVE_BENCHMARK_PERCENTILES
  	bool "Compute p50/p95/p99 + trimmed mean + stddev per case"
  	default y
  	help
  	  Stash per-iteration timings in an 8 KiB buffer and post-process
  	  to derive percentile statistics and a trimmed mean (top 1%
  	  dropped — robust against scheduler jitter).  Disable on the
  	  smallest targets to save the buffer; min/max/avg still work.

  config OVE_BENCHMARK_OUTPUT_JSON
  	bool "Also emit machine-readable JSON output"
  	default y
  	help
  	  In addition to the human ASCII table, emit per-suite JSON
  	  bracketed by ###BENCH_JSON_BEGIN / ###BENCH_JSON_END sentinels.
  	  Consumed by scripts/bench_compare.py for cross-binding diff
  	  reports.

  config OVE_BENCHMARK_WORST_CASE_TIMING
  	bool "Disable Cortex-M caches and accelerators for worst-case bench timing"
  	default n
  	help
  	  When set, the bench harness disables every hardware feature on
  	  STM32F7 that hides flash-fetch latency or otherwise injects
  	  per-call non-determinism: Cortex-M7 I-cache and D-cache
  	  (SCB_DisableICache / SCB_DisableDCache), branch prediction
  	  (SCB->CCR BP bit), and the STM32F7 ART accelerator + flash
  	  prefetch buffer (FLASH->ACR ARTEN/PRFTEN).
  	  The motivation is that many ARM microcontrollers (Cortex-M0+,
  	  M3, lower-end M4) ship without caches or accelerators, so a
  	  bench taken with all of those on overstates real-world
  	  performance for that class of target.  With this knob set the
  	  numbers approximate worst-case ARM-MCU timing.  Currently
  	  STM32F7-only — gated on CONFIG_OVE_BOARD_STM32F746G_DISCO.
  	  Default off; flip on for the published worst-case benchmark
  	  reports.

  config OVE_BENCHMARK_NOISE_AUDIT
  	bool "Snapshot running mean/stddev at iteration checkpoints"
  	default n
  	help
  	  Calibration mode: while running each case, snapshot the Welford
  	  running mean and stddev at iteration counts 100, 500, 1000,
  	  2500, 5000, 10000 and emit them as an "audit" array in the
  	  per-case JSON.  Consumed by scripts/bench_audit.py to compute
  	  CV (stddev/mean) vs N and recommend a per-class iteration
  	  count for the production benches.  Throwaway — turn off once
  	  the iteration counts have been locked in.
