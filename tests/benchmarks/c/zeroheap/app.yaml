lang: c
config_name: benchmark_zh
description: "RTOS Abstraction Benchmark (zero-heap mode)"
sources:
  - ../src/app.c
  - ../src/bench_harness.c
  - ../src/bench_output.c
  - ../src/bench_memory.c
  - ../src/bench_time.c
  - ../src/bench_thread.c
  - ../src/bench_sync.c
  - ../src/bench_queue.c
  - ../src/bench_timer.c
  - ../src/bench_eventgroup.c
  - ../src/bench_workqueue.c
  - ../src/bench_stream.c
  - ../src/bench_native_posix.c
  - ../src/bench_native_freertos.c
  - ../src/bench_native_nuttx.c
  - ../src/bench_native_zephyr.c
includes:
  - ../include
defconfig:
  - CONFIG_OVE_ZERO_HEAP=y
  - CONFIG_OVE_BSP=y
  - CONFIG_OVE_QUEUE=y
  - CONFIG_OVE_TIMER=y
  - CONFIG_OVE_EVENTGROUP=y
  - CONFIG_OVE_WORKQUEUE=y
  - CONFIG_OVE_STREAM=y
  - CONFIG_OVE_SIM_DASHBOARD=n
  - CONFIG_OVE_TRACE_MARKERS=n
  - CONFIG_OVE_TRACE_STREAM=n
  - CONFIG_OVE_THREAD_STATE_STATS=n
kconfig: |
  config OVE_BENCHMARK_ITERATIONS
  	int "Number of measurement iterations per benchmark case"
  	default 1000

  config OVE_BENCHMARK_WARMUP
  	int "Number of warmup iterations before measurement"
  	default 100

  config OVE_BENCHMARK_INCLUDE_MEMORY
  	bool "Include memory usage benchmarks"
  	default y

  config OVE_BENCHMARK_PERCENTILES
  	bool "Compute p50/p95/p99 + trimmed mean + stddev per case"
  	default y

  config OVE_BENCHMARK_OUTPUT_JSON
  	bool "Also emit machine-readable JSON output"
  	default y

  config OVE_BENCHMARK_DISABLE_ICACHE
  	bool "Disable Cortex-M I-cache for the bench run (diagnostic)"
  	default n
