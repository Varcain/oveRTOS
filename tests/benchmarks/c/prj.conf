# oveRTOS benchmark app — Zephyr prj.conf overlay.
#
# Avoid stack overflow in Zephyr's logging subsystem when the bench
# burst-prints many large rows back-to-back.  The bench prints ~50
# table rows + JSON envelopes per binding (each up to ~250 chars),
# which fills the default 1 KiB log buffer faster than the 2 KiB
# logging-thread stack can drain it under the deferred mode.
# Observed crash: corrupted return address on `logging_stack` lands
# the CPU in random flash code (e.g. LL_DMA_Init) executing with
# garbage args — see investigation in commit history.
#
# Two-pronged fix:
#   1. Switch to immediate logging — log calls run inline on the
#      caller's stack (the bench runner has 8 KiB), no separate
#      logging thread, no deferred buffer.
#   2. Disable LOG entirely if immediate isn't enough — printk falls
#      back to direct UART, no logging machinery at all.  Setting
#      CONFIG_LOG_MODE_MINIMAL turns LOG_INF/LOG_WRN/LOG_ERR into
#      printk wrappers; oveRTOS's `OVE_LOG_*` is independent of
#      Zephyr's LOG_* and goes through `ove_console_write` →
#      `printk` directly, so MINIMAL is sufficient for the bench
#      and shrinks the binary.
CONFIG_LOG_MODE_MINIMAL=y
# CONFIG_LOG_MODE_DEFERRED is not set
# CONFIG_LOG_MODE_IMMEDIATE is not set

# Disable Zephyr printk's rate limiting / buffering.  The bench bursts
# ~50 rows + JSON envelopes per binding back-to-back; with the default
# asynchronous printk the UART tx ring fills before the previous chunk
# drains, dropping the tail of each bench's serial transcript (observed:
# Suite SKIPPED messages, suite headers, and individual case rows
# missing in earlier captures).  Synchronous printk gives every
# `ove_console_write` enough back-pressure to flush before the next
# call starts.  Slows the bench by a few ms total at the print boundary
# only — invisible in the per-call timings since those are DWT
# cycle-counter-bracketed, not wall-clock.
CONFIG_PRINTK_SYNC=y
CONFIG_LOG_BLOCK_IN_THREAD=y
