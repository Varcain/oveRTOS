lang: zig
config_name: benchmark_zig_heap
description: "Zig RTOS Abstraction Benchmark (heap mode)"
zig:
  src_dir: ../src
  lib_name: benchmark_zig
c_sources:
  - ../../c/src/bench_harness.c
  - ../../c/src/bench_output.c
  - ../../c/src/bench_memory.c
  - ../../c/src/bench_native_posix.c
  - ../../c/src/bench_native_freertos.c
  - ../../c/src/bench_native_nuttx.c
  - ../../c/src/bench_native_zephyr.c
c_includes:
  - ../../c/include
defconfig:
  - CONFIG_OVE_BSP=y
  - CONFIG_OVE_QUEUE=y
  - CONFIG_OVE_TIMER=y
  - CONFIG_OVE_EVENTGROUP=y
  - CONFIG_OVE_WORKQUEUE=y
  - CONFIG_OVE_STREAM=y
  - CONFIG_OVE_SIM_DASHBOARD=n
  - CONFIG_OVE_TRACE_MARKERS=n
  - CONFIG_OVE_TRACE_STREAM=n
  - CONFIG_OVE_THREAD_STATE_STATS=n
  # Worst-case timing: disable I-cache, D-cache, branch predictor, ART,
  # and flash prefetch on STM32F7 so published numbers approximate a
  # cacheless ARM MCU.  See docs-site/docs/benchmarks/index.md
  # ("Worst-case timing mode").  No-op on POSIX / sim builds.
  - CONFIG_OVE_BENCHMARK_WORST_CASE_TIMING=y
kconfig: |
  config OVE_BENCHMARK_ITERATIONS
  	int "Number of measurement iterations per benchmark case"
  	default 1000

  config OVE_BENCHMARK_WARMUP
  	int "Number of warmup iterations before measurement"
  	default 100

  config OVE_BENCHMARK_INCLUDE_MEMORY
  	bool "Include memory usage benchmarks"
  	default y

  config OVE_BENCHMARK_PERCENTILES
  	bool "Compute p50/p95/p99 + trimmed mean + stddev per case"
  	default y

  config OVE_BENCHMARK_OUTPUT_JSON
  	bool "Also emit machine-readable JSON output"
  	default y

  config OVE_BENCHMARK_WORST_CASE_TIMING
  	bool "Disable Cortex-M caches and accelerators for worst-case bench timing"
  	default n
  	help
  	  See c/heap/app.yaml for the canonical help text.  Disables
  	  I-cache, D-cache, branch predictor, ART accelerator, and flash
  	  prefetch on STM32F7 to approximate worst-case ARM-MCU timing.

  config OVE_BENCHMARK_NOISE_AUDIT
  	bool "Snapshot running mean/stddev at iteration checkpoints"
  	default n
  	help
  	  Calibration mode — see c/heap/app.yaml for the canonical help.
