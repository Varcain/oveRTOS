lang: c
config_name: linux_interop_diagnostic
description: "Linux personality interop demo — Diagnostic profile"
sources:
  - ../linux_interop/src/app.c
  - ../linux_interop/src/network_smoke.c
  - ../linux_interop/src/qualification.c
  - ../linux_interop/src/roundtrip.c
defconfig:
  - CONFIG_OVE_LINUX=y
  - CONFIG_OVE_LINUX_DEV=y
  - CONFIG_OVE_LINUX_DEV_FB=y
  - CONFIG_OVE_LINUX_DEV_DMA2D=y
  - CONFIG_OVE_LINUX_DEV_INPUT=y
  - CONFIG_OVE_LINUX_DEV_INPUT_TESTPAD=y
  - CONFIG_OVE_LINUX_NET=y
  - CONFIG_OVE_LINUX_NETIF_DHCP=n
  - CONFIG_OVE_LINUX_NETIF_IPV4_ADDRESS="172.1.1.2"
  - CONFIG_OVE_LINUX_NETIF_IPV4_NETMASK="255.255.255.0"
  - CONFIG_OVE_LINUX_NETIF_IPV4_GATEWAY="172.1.1.1"
  - CONFIG_OVE_LINUX_NETIF_ADDRESS_WAIT_MS=10000
  - CONFIG_OVE_LINUX_NETFS=y
  - CONFIG_OVE_LINUX_NETFS_SERVER_IP="172.1.1.1"
  - CONFIG_OVE_LINUX_NETFS_PORT=564
  - CONFIG_OVE_LINUX_NETFS_ANAME="/srv/pi9"
  - CONFIG_OVE_LINUX_NETFS_MOUNTPOINT="/mnt/pi"
  - CONFIG_OVE_LINUX_NETFS_UNAME="root"
  - CONFIG_OVE_LINUX_NETFS_EXEC=y
  - CONFIG_OVE_LINUX_PTY=y
  # Whole-world checkpoints are shared by all profiles. This profile adds the
  # measurement and log detail needed to investigate a failed checkpoint.
  - CONFIG_OVE_LINUX_LATENCY=y
  - CONFIG_OVE_LOG_LEVEL_DBG=y
rtos_defconfig:
  freertos:
    - CONFIG_FREERTOS_USE_TIME_SLICING=n
incompatible_boards:
  - host
  - wasm
