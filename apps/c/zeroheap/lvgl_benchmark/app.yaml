lang: c
config_name: lvgl_benchmark_c_zh
description: "LVGL rendering benchmark (C)"
sources:
  - src/app.c
  - src/benchmark_perf.c
  - src/assets/benchmark_cogwheel_rgb.c
  - src/assets/benchmark_cogwheel_argb.c
  - src/assets/benchmark_avatar.c
includes:
  - include
defconfig:
  - CONFIG_OVE_ZERO_HEAP=y
  # Pin LVGL TLSF pool to fixed BSS size; no spillover to system malloc.
  - CONFIG_LV_MEM_SIZE_KILOBYTES=64
  - CONFIG_LV_MEM_POOL_EXPAND_SIZE_KILOBYTES=0
  - CONFIG_OVE_BSP=y
  - CONFIG_OVE_LVGL=y
  - CONFIG_OVE_TIMER=y
