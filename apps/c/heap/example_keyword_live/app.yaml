lang: c
config_name: example_keyword_live_heap
description: "Live DMIC Keyword Detection"
sources:
  - src/app.c
includes:
  - src
  - include
defconfig:
  - CONFIG_OVE_BSP=y
  - CONFIG_OVE_INFER=y
  - CONFIG_OVE_AUDIO=y
  - CONFIG_OVE_AUDIO_NODE_CONVERTER=y
kconfig: |
  config OVE_INFER
      default y
  config OVE_AUDIO
      default y
