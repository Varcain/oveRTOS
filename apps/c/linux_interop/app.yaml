lang: c
config_name: linux_interop
description: "Linux personality interop demo (Cortex-M33 / MPS2-AN521)"
sources:
  - src/app.c
# Pull in the Linux personality (engine-agnostic core + Zephyr seam) plus the
# bounded arena + bFLT loader it runs on, and the oveRTOS RTOS primitives the
# demo uses on the RTOS side. The USERSPACE/--wrap/rootfs-include wiring is
# supplied by the qemu-mps2-an521 board.
defconfig:
  - CONFIG_OVE_LINUX=y
  - CONFIG_OVE_ARENA=y
  - CONFIG_OVE_LOADER=y
  - CONFIG_OVE_QUEUE=y
  - CONFIG_OVE_TIME=y
# The personality needs the Cortex-M33 USERSPACE substrate; build with
#   ove defconfig-fragments qemu-mps2-an521.zephyr.linux_interop
incompatible_boards:
  - qemu-mps2-an500
  - stm32f746g-discovery
  - host
  - wasm
