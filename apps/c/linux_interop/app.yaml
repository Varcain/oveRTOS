lang: c
config_name: linux_interop
description: "Linux personality interop demo (an521/Zephyr or an500/FreeRTOS)"
sources:
  - src/app.c
# Pull in the Linux personality (engine-agnostic core + per-engine seam) plus the
# bounded arena + bFLT loader it runs on, and the oveRTOS RTOS primitives the demo
# uses on the RTOS side. The seam wiring (USERSPACE/--wrap on Zephyr, the SVC-owning
# seam on FreeRTOS) and the rootfs-include come from the selected board.
defconfig:
  - CONFIG_OVE_LINUX=y
  - CONFIG_OVE_ARENA=y
  - CONFIG_OVE_LOADER=y
  - CONFIG_OVE_QUEUE=y
  - CONFIG_OVE_TIME=y
# Engine-agnostic. Build on either substrate:
#   ove defconfig-fragments qemu-mps2-an521.zephyr.linux_interop     (Cortex-M33 USERSPACE)
#   ove defconfig-fragments qemu-mps2-an500.freertos.linux_interop   (Cortex-M7 FreeRTOS)
incompatible_boards:
  - stm32f746g-discovery
  - host
  - wasm
