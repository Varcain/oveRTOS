lang: c
config_name: linux_interop
description: "Linux personality interop demo (Zephyr, FreeRTOS, or NuttX)"
sources:
  - src/app.c
  - src/rt_scope.c
# Pull in the Linux personality (engine-agnostic core + per-engine seam) plus the
# bounded arena + bFLT loader it runs on, and the oveRTOS RTOS primitives the demo
# uses on the RTOS side. The seam wiring (USERSPACE/--wrap on Zephyr, the SVC-owning
# seam on FreeRTOS) and the rootfs placement come from the selected board.
defconfig:
  - CONFIG_OVE_LINUX=y
  - CONFIG_OVE_ARENA=y
  - CONFIG_OVE_LOADER=y
  - CONFIG_OVE_QUEUE=y
  - CONFIG_OVE_TIME=y
  # /dev character-device layer + framebuffer (/dev/fb0). A board without an fb
  # backend links weak "no display" HAL stubs, so /dev/fb0 is simply absent there.
  - CONFIG_OVE_LINUX_DEV=y
  - CONFIG_OVE_LINUX_DEV_FB=y
  - CONFIG_OVE_LINUX_DEV_DMA2D=y
  # /dev/input/event0 evdev touch + the QEMU synthetic injector (FT5336 is enabled
  # per-board for real STM32F746 hardware, since it needs an i2c HAL backend).
  - CONFIG_OVE_LINUX_DEV_INPUT=y
  - CONFIG_OVE_LINUX_DEV_INPUT_TESTPAD=y
  # BSD socket layer: bridge the personality's socket syscalls to ove_net (selects
  # CONFIG_OVE_NET → per-engine TCP/IP stack + the board's Ethernet driver). Lets
  # stock networking tools (wget, nc, ping) run under the personality. On QEMU the
  # board provides a shared-memory NIC; on real STM32F746 the LAN8742 driver.
  - CONFIG_OVE_LINUX_NET=y
  # Pseudo-terminal layer (/dev/ptmx + /dev/pts/N) for an interactive network login
  # shell — an SSH server (dropbear) runs the login shell on a pty slave.
  - CONFIG_OVE_LINUX_PTY=y
rtos_defconfig:
  freertos:
    # The personality schedules guest processes through blocking syscalls and
    # coordinator wakeups. Do not round-robin equal-priority guest tasks every
    # 1 ms tick: it lets background userspace inflate foreground render latency.
    - CONFIG_FREERTOS_USE_TIME_SLICING=n
# Engine-agnostic. Build on QEMU on any substrate, plus real STM32F746 hardware:
#   ove defconfig-fragments qemu-mps2-an521.zephyr.linux_interop     (Cortex-M33 USERSPACE)
#   ove defconfig-fragments qemu-mps2-an500.freertos.linux_interop   (Cortex-M7 FreeRTOS)
#   ove defconfig-fragments stm32f746g-discovery.freertos.linux_interop  (Cortex-M7 real HW)
#   ove defconfig-fragments stm32f746g-discovery.nuttx.linux_interop     (Cortex-M7 real HW)
#   ove defconfig-fragments stm32f746g-discovery.zephyr.linux_interop    (Cortex-M7 real HW)
# All three seams are ported to real STM32F746 hardware (program pool in external SDRAM, USART1
# console), and all three run each Linux program unprivileged behind an MPU view: FreeRTOS uses a
# restricted MPU task, Zephyr uses K_USER + a memory domain, and the NuttX seam sets CONTROL.nPRIV
# and programs the MPU directly in BUILD_FLAT (NuttX's CONFIG_ARM_MPU stays off to avoid conflict).
incompatible_boards:
  - host
  - wasm
