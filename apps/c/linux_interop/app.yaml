lang: c
config_name: linux_interop
description: "Linux personality interop demo — Full compatibility profile"
sources:
  - src/app.c
  - src/network_smoke.c
  - src/qualification.c
  - src/roundtrip.c
  - src/rt_scope.c
defconfig:
  - CONFIG_OVE_LINUX=y
  # Persistent FAT storage and raw block maintenance.
  - CONFIG_OVE_LINUX_FS=y
  - CONFIG_OVE_LINUX_BLOCK=y
  - CONFIG_OVE_LINUX_BLOCK_WRITE=y
  - CONFIG_OVE_LINUX_FS_SERVER_PERIOD_US=1000
  - CONFIG_OVE_LINUX_FS_SERVER_BUDGET_US=300
  # Framebuffer, DMA2D, and touch devices.
  - CONFIG_OVE_LINUX_DEV=y
  - CONFIG_OVE_LINUX_DEV_FB=y
  - CONFIG_OVE_LINUX_DEV_DMA2D=y
  - CONFIG_OVE_LINUX_DEV_INPUT=y
  - CONFIG_OVE_LINUX_DEV_INPUT_TESTPAD=y
  # Sockets and the demo's static network topology.
  - CONFIG_OVE_LINUX_NET=y
  - CONFIG_OVE_LINUX_NETIF_DHCP=n
  - CONFIG_OVE_LINUX_NETIF_IPV4_ADDRESS="172.1.1.2"
  - CONFIG_OVE_LINUX_NETIF_IPV4_NETMASK="255.255.255.0"
  - CONFIG_OVE_LINUX_NETIF_IPV4_GATEWAY="172.1.1.1"
  - CONFIG_OVE_LINUX_NETIF_ADDRESS_WAIT_MS=10000
  # Read-only 9P filesystem with remote FDPIC execution.
  - CONFIG_OVE_LINUX_NETFS=y
  - CONFIG_OVE_LINUX_NETFS_SERVER_IP="172.1.1.1"
  - CONFIG_OVE_LINUX_NETFS_PORT=564
  - CONFIG_OVE_LINUX_NETFS_ANAME="/srv/pi9"
  - CONFIG_OVE_LINUX_NETFS_MOUNTPOINT="/mnt/pi"
  - CONFIG_OVE_LINUX_NETFS_UNAME="root"
  - CONFIG_OVE_LINUX_NETFS_EXEC=y
  # PTYs for interactive network login.
  - CONFIG_OVE_LINUX_PTY=y
rtos_defconfig:
  freertos:
    # LXP owns guest rotation; do not time-slice unrelated host work.
    - CONFIG_FREERTOS_USE_TIME_SLICING=n
    # Wake socket waiters and bound saturated RX work.
    - CONFIG_OVE_NET_RX_READY_NOTIFY=y
    - CONFIG_OVE_NET_RX_FAIR_SCHEDULING=y
  zephyr:
    # Four full-frame RX slots, with room for concurrent ACK/ARP traffic.
    - CONFIG_OVE_ZEPHYR_NET_BUF_DATA_SIZE=512
    - CONFIG_OVE_ZEPHYR_NET_BUF_RX_COUNT=12
    - CONFIG_OVE_ZEPHYR_NET_BUF_TX_COUNT=12
# Supported QEMU and STM32F746 engine combinations are documented in README.md.
incompatible_boards:
  - host
  - wasm
