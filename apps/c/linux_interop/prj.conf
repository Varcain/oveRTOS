# Built for mps2/an521/cpu0 (Cortex-M33). CONFIG_USERSPACE gives unprivileged
# user threads + MPU memory domains — the substrate the Linux personality needs
# to run a loaded program unprivileged and trap its svc. The native RTOS worker
# thread runs alongside it as a privileged kernel thread.
CONFIG_USERSPACE=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_THREAD_NAME=y
# z_do_kernel_oops()'s callee-saved-register argument (r7 = the Linux syscall
# number) is only populated with CONFIG_EXTRA_EXCEPTION_INFO on Armv7/8-M.
CONFIG_EXTRA_EXCEPTION_INFO=y
