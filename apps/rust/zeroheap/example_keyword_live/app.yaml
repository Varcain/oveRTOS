config_name: example_keyword_live_rust_zh
lang: rust
description: "Live DMIC Keyword Detection (Rust)"
rust:
  lib_name: example_keyword_live_rust
defconfig:
  - CONFIG_OVE_ZERO_HEAP=y
  - CONFIG_OVE_BSP=y
  - CONFIG_OVE_INFER=y
  - CONFIG_OVE_AUDIO=y
  - CONFIG_OVE_AUDIO_NODE_CONVERTER=y
kconfig: |
  config OVE_INFER
      default y
  config OVE_AUDIO
      default y
