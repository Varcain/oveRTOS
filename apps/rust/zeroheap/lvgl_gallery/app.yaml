lang: rust
config_name: lvgl_gallery_rust_zh
description: "LVGL widget gallery (Rust) — showcases every wrapped LVGL API"
rust:
  lib_name: lvgl_gallery_rust
images:
  - assets/badge.png
incompatible_boards:
  # The an521 has no display.
  - qemu-mps2-an521
defconfig:
  - CONFIG_OVE_ZERO_HEAP=y
  - CONFIG_OVE_BSP=y
  - CONFIG_OVE_LVGL=y
  - CONFIG_OVE_TIMER=y
