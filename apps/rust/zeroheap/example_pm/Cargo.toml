[package]
name = "example_pm_rust"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"

[lib]
crate-type = ["staticlib"]

[dependencies]
ove = { path = "../../../../bindings/rust/ove" }
log = "0.4"

[features]
default = []
std = ["ove/std"]

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
