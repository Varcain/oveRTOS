lang: rust
config_name: example_async_net_rust_zh
description: "Rust async networking (embassy-net) demo on oveRTOS — zero-heap mode"
rust:
  lib_name: example_async_net_zh
# embassy-net needs a board-specific driver (QemuShmDriver on QEMU MPS2,
# Stm32f7EthDriver on STM32F746G-DISCO). WASM has no irq backend, host
# has no NetDriver — both link/compile-fail.
incompatible_boards:
  - host
  - wasm
defconfig:
  - CONFIG_OVE_ZERO_HEAP=y
  - CONFIG_OVE_SYNC=y
  - CONFIG_OVE_TIMER=y
  - CONFIG_OVE_TIME=y
  - CONFIG_OVE_ASYNC=y
  - CONFIG_OVE_ASYNC_NET=y
