lang: rust
config_name: lvgl_benchmark_rust_zh
description: "LVGL rendering benchmark (Rust)"
c_sources:
  - ../../../c/zeroheap/lvgl_benchmark/src/benchmark_perf.c
  - ../../../c/zeroheap/lvgl_benchmark/src/assets/benchmark_cogwheel_rgb.c
  - ../../../c/zeroheap/lvgl_benchmark/src/assets/benchmark_cogwheel_argb.c
  - ../../../c/zeroheap/lvgl_benchmark/src/assets/benchmark_avatar.c
c_includes:
  - ../../../c/zeroheap/lvgl_benchmark/include
rust:
  lib_name: lvgl_benchmark_rust
incompatible_boards:
  # The an521 has no display.
  - qemu-mps2-an521
defconfig:
  - CONFIG_OVE_ZERO_HEAP=y
  - CONFIG_OVE_BSP=y
  - CONFIG_OVE_LVGL=y
  - CONFIG_OVE_TIMER=y
  # Zephyr: the LVGL sys_heap IS the allocator (LV_MEM_SIZE is ignored) and its 16 KB
  # default wedges the software renderer on the heavy scenes — the opacity-layer scene
  # allocates ~15 KB ARGB8888 layer tiles (GDB-confirmed), and 64 KB still runs out and
  # corrupts the pool on the real panel.  96 KB matches the FreeRTOS LV_MEM_SIZE and is a
  # fixed static buffer.  Zephyr-only symbol — inert on other
  # engines.
  - CONFIG_ZEPHYR_LV_MEM_POOL_SIZE=98304
