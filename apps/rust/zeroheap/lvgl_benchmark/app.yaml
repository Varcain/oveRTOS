lang: rust
config_name: lvgl_benchmark_rust_zh
description: "LVGL rendering benchmark (Rust)"
c_sources:
  - ../../../c/zeroheap/lvgl_benchmark/src/benchmark_perf.c
  - ../../../c/zeroheap/lvgl_benchmark/src/assets/benchmark_cogwheel_rgb.c
  - ../../../c/zeroheap/lvgl_benchmark/src/assets/benchmark_cogwheel_argb.c
  - ../../../c/zeroheap/lvgl_benchmark/src/assets/benchmark_avatar.c
c_includes:
  - ../../../c/zeroheap/lvgl_benchmark/include
rust:
  lib_name: lvgl_benchmark_rust
defconfig:
  - CONFIG_OVE_ZERO_HEAP=y
  # Pin LVGL TLSF pool to fixed BSS size; no spillover to system malloc.
  - CONFIG_LV_MEM_SIZE_KILOBYTES=64
  - CONFIG_LV_MEM_POOL_EXPAND_SIZE_KILOBYTES=0
  - CONFIG_OVE_BSP=y
  - CONFIG_OVE_LVGL=y
  - CONFIG_OVE_TIMER=y
