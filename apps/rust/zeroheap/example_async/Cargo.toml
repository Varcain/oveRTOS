[package]
name = "example_async_zh"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"

[lib]
crate-type = ["staticlib"]

[dependencies]
# Zero-heap async: no `alloc` feature.  The macro-generated trampoline
# uses a `static mut MaybeUninit<Executor>` slot instead of Box::leak.
ove = { path = "../../../../bindings/rust/ove", features = ["async"] }
log = "0.4"
embassy-executor = { version = "0.7", default-features = false }
embassy-time = { version = "0.4", default-features = false, features = ["tick-hz-1_000_000"] }
embassy-sync = { version = "0.7", default-features = false }

[features]
default = []
std = ["ove/std"]

# POSIX host build: embassy-executor's arch-std + critical-section's
# built-in std impl.
[target.'cfg(not(target_os = "none"))'.dependencies]
ove = { path = "../../../../bindings/rust/ove", features = ["async-arch-std"] }

# Bare-metal ARM build: cortex-m executor + ove_irq_lock critical-section.
[target.'cfg(target_os = "none")'.dependencies]
ove = { path = "../../../../bindings/rust/ove", features = ["async-arch-cortex-m"] }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
