[package]
name = "example_async_zh"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"

[lib]
crate-type = ["staticlib"]

[dependencies]
# Zero-heap async: no `alloc` feature. Our Executor::take stores the
# executor in a function-scope `static mut MaybeUninit` slot instead
# of leaking a Box.
ove = { path = "../../../../bindings/rust/ove", features = ["async"] }
log = "0.4"
embassy-executor = { version = "0.7", default-features = false }
embassy-time = { version = "0.4", default-features = false, features = ["tick-hz-1_000_000"] }
embassy-sync = { version = "0.7", default-features = false }

[features]
default = []
std = ["ove/std"]

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
