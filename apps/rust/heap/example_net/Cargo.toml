[package]
name = "example_net_rust"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"

[lib]
crate-type = ["staticlib"]

[dependencies]
ove = { path = "../../../../bindings/rust/ove", features = ["alloc"] }
log = "0.4"
ove-allocator = { path = "../../../../bindings/rust/ove-allocator", default-features = false }

[features]
default = []
std = ["ove/std", "ove-allocator/no_install"]

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
