lang: rust
config_name: example_async_rust_heap
description: "Rust async (Embassy) demo on oveRTOS"
rust:
  lib_name: example_async
# WASM has no irq backend (no wasm_irq.c), so CONFIG_OVE_ASYNC links
# fail with undefined ove_irq_lock / ove_irq_unlock symbols.
incompatible_boards:
  - wasm
defconfig:
  - CONFIG_OVE_SYNC=y
  - CONFIG_OVE_TIMER=y
  - CONFIG_OVE_TIME=y
  - CONFIG_OVE_ASYNC=y
