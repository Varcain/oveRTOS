[package]
name = "example_async"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"

[lib]
crate-type = ["staticlib"]

[dependencies]
# Base features (target-agnostic). The arch-* feature picks the right
# embassy-executor arch + critical-section width per target below.
ove = { path = "../../../../bindings/rust/ove", features = ["alloc", "async"] }
log = "0.4"
ove-allocator = { path = "../../../../bindings/rust/ove-allocator", default-features = false }
embassy-executor = { version = "0.7", default-features = false }
embassy-time = { version = "0.4", default-features = false, features = ["tick-hz-1_000_000"] }
embassy-sync = { version = "0.7", default-features = false }

# POSIX host build: embassy-executor + critical-section's built-in std impl.
[target.'cfg(not(target_os = "none"))'.dependencies]
ove = { path = "../../../../bindings/rust/ove", features = ["async-arch-std"] }

# Bare-metal ARM build (target_os = "none"): cortex-m executor + our
# critical-section impl backed by ove_irq_lock. The `cortex-m` crate is
# pulled in transitively by `embassy-executor/arch-cortex-m`.
[target.'cfg(target_os = "none")'.dependencies]
ove = { path = "../../../../bindings/rust/ove", features = ["async-arch-cortex-m"] }

[features]
default = []
# On `std` builds the std allocator is already linked, so we tell
# ove-allocator not to install its own libc-malloc-backed one.
std = ["ove/std", "ove-allocator/no_install"]

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
