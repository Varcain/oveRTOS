lang: rust
config_name: example_async_net_rust_heap
description: "Rust async networking (embassy-net) demo on oveRTOS"
rust:
  lib_name: example_async_net
# embassy-net needs a board-specific driver. WASM has no irq backend
# and host has no NetDriver — both link/compile-fail. The STM32F7 ETH
# C driver (drivers/freertos/stm32f7/stm32f7_eth_async.c) is FreeRTOS-
# only, so STM32F7 NuttX/Zephyr can't link this app either.
incompatible_boards:
  - host
  - wasm
  - stm32f746.nuttx
  - stm32f746.zephyr
defconfig:
  - CONFIG_OVE_SYNC=y
  - CONFIG_OVE_TIMER=y
  - CONFIG_OVE_TIME=y
  - CONFIG_OVE_ASYNC=y
  - CONFIG_OVE_ASYNC_NET=y
