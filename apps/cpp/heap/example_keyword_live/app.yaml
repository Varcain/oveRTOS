config_name: example_keyword_live_cpp_heap
lang: cpp
description: "Live DMIC Keyword Detection (C++)"
sources:
  - src/app.cpp
includes:
  - ../../../c/heap/example_keyword_live/include
incompatible_boards:
  # The an521 has no audio input.
  - qemu-mps2-an521
defconfig:
  - CONFIG_OVE_BSP=y
  - CONFIG_OVE_INFER=y
  - CONFIG_OVE_AUDIO=y
  - CONFIG_OVE_AUDIO_NODE_CONVERTER=y
kconfig: |
  config OVE_INFER
      default y
  config OVE_AUDIO
      default y
