lang: zig
config_name: lvgl_gallery_zig_heap
description: "LVGL widget gallery (Zig) — showcases every wrapped LVGL API"
zig:
  src_dir: src
  lib_name: lvgl_gallery_zig
images:
  - assets/badge.png
defconfig:
  - CONFIG_OVE_BSP=y
  - CONFIG_OVE_LVGL=y
  - CONFIG_OVE_TIMER=y
rtos_defconfig:
  freertos:
    # Sized for the F746: its internal SRAM also holds LVGL's 96 KB pool, the 20-line draw
    # buffer and this app's 16 KB canvas, which the board's 128 KB heap overflows. Peak use on
    # the real panel is under 6 KB.
    - CONFIG_FREERTOS_TOTAL_HEAP_SIZE=110592
