lang: zig
config_name: lvgl_benchmark_zig_heap
description: "LVGL rendering benchmark (Zig)"
zig:
  src_dir: src
  lib_name: lvgl_benchmark_zig
c_sources:
  - ../../../c/heap/lvgl_benchmark/src/benchmark_perf.c
  - ../../../c/heap/lvgl_benchmark/src/assets/benchmark_cogwheel_rgb.c
  - ../../../c/heap/lvgl_benchmark/src/assets/benchmark_cogwheel_argb.c
  - ../../../c/heap/lvgl_benchmark/src/assets/benchmark_avatar.c
c_includes:
  - ../../../c/heap/lvgl_benchmark/include
defconfig:
  - CONFIG_OVE_BSP=y
  - CONFIG_OVE_LVGL=y
  - CONFIG_OVE_TIMER=y
  # Zephyr: the LVGL sys_heap IS the allocator (LV_MEM_SIZE is ignored) and its 16 KB
  # default wedges the software renderer on the heavy scenes — the opacity-layer scene
  # allocates ~15 KB ARGB8888 layer tiles (GDB-confirmed).  96 KB matches the FreeRTOS/
  # NuttX LV_MEM_SIZE.  Zephyr-only symbol (depends on ZEPHYR_LVGL) — inert on other engines.
  - CONFIG_ZEPHYR_LV_MEM_POOL_SIZE=98304
rtos_defconfig:
  freertos:
    # Sized for the F746: its internal SRAM also holds LVGL's 96 KB pool and the 20-line draw
    # buffer, so the board's 128 KB heap leaves less than the 2 KB build margin. Peak use on
    # the real panel is under 17 KB (C benchmark, including its 16 KB graphics stack).
    - CONFIG_FREERTOS_TOTAL_HEAP_SIZE=126976
