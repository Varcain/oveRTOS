lang: zig
config_name: example_pm_zig_zh
description: "Zig Power Management Demo"
zig:
  src_dir: src
  lib_name: example_pm_zig
incompatible_boards:
  # The Zig bindings do not build for the an521's Cortex-M33.
  - qemu-mps2-an521
defconfig:
  - CONFIG_OVE_ZERO_HEAP=y
  - CONFIG_OVE_PM=y
  - CONFIG_OVE_TIMER=y
