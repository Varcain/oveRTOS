lang: zig
config_name: example_zig_zh
description: "Zig Demo"
zig:
  src_dir: src
  lib_name: example_zig
defconfig:
  - CONFIG_OVE_ZERO_HEAP=y
  - CONFIG_OVE_BSP=y
  - CONFIG_OVE_LVGL=y
  - CONFIG_OVE_QUEUE=y
  - CONFIG_OVE_TIMER=y
  # Pin LVGL's TLSF pool to a fixed BSS size; no spillover to system malloc.
  - CONFIG_LV_MEM_SIZE_KILOBYTES=64
  - CONFIG_LV_MEM_POOL_EXPAND_SIZE_KILOBYTES=0
