lang: zig
config_name: example_zig_zh
description: "Zig Demo"
zig:
  src_dir: src
  lib_name: example_zig
incompatible_boards:
  # The an521 has no display.
  - qemu-mps2-an521
defconfig:
  - CONFIG_OVE_ZERO_HEAP=y
  - CONFIG_OVE_BSP=y
  - CONFIG_OVE_LVGL=y
  - CONFIG_OVE_QUEUE=y
  - CONFIG_OVE_TIMER=y
