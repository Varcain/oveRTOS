config_name: example_keyword_live_zig_zh
lang: zig
description: "Live DMIC Keyword Detection (Zig)"
zig:
  src_dir: ../../heap/example_keyword_live/src
  lib_name: example_keyword_live_zig
incompatible_boards:
  # The an521 has no audio input.
  - qemu-mps2-an521
defconfig:
  - CONFIG_OVE_ZERO_HEAP=y
  - CONFIG_OVE_BSP=y
  - CONFIG_OVE_INFER=y
  - CONFIG_OVE_AUDIO=y
kconfig: |
  config OVE_INFER
      default y
  config OVE_AUDIO
      default y
