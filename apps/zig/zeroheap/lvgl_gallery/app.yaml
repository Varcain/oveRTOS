lang: zig
config_name: lvgl_gallery_zig_zh
description: "LVGL widget gallery (Zig) — showcases every wrapped LVGL API"
zig:
  src_dir: ../../heap/lvgl_gallery/src
  lib_name: lvgl_gallery_zig
images:
  - ../../heap/lvgl_gallery/assets/badge.png
incompatible_boards:
  # The an521 has no display.
  - qemu-mps2-an521
defconfig:
  - CONFIG_OVE_ZERO_HEAP=y
  - CONFIG_OVE_BSP=y
  - CONFIG_OVE_LVGL=y
  - CONFIG_OVE_TIMER=y
