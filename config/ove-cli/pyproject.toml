[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ove"
version = "0.1.0"
description = "oveRTOS RTOS Abstraction Framework — Build CLI"
requires-python = ">=3.8"
dependencies = [
    "kconfiglib>=14.1.0",
    "jinja2>=3.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[project.scripts]
ove = "ove.cli:main"

[tool.setuptools.packages.find]
where = ["."]
