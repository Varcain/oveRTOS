# oveRTOS Component Manifest
# All external component versions are defined here.
# Modifying versions without committing triggers a build warning.

toolchains:
  arm-gnu:
    version: "15.2.rel1"
    url: "https://developer.arm.com/-/media/Files/downloads/gnu/15.2.rel1/binrel/arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi.tar.xz"
  zig:
    version: "0.15.2"
  rust:
    min_version: "1.85"
  zephyr-sdk:
    version: "0.17.0"
  emscripten:
    version: "3.1.51"
    url: "https://github.com/emscripten-core/emsdk.git"

rtos:
  freertos:
    stm32cubef7:
      version: "v1.17.2"
      url: "https://github.com/STMicroelectronics/STM32CubeF7.git"
    kernel-qemu:
      version: "V11.1.0"
      url: "https://github.com/FreeRTOS/FreeRTOS-Kernel.git"
  zephyr:
    version: "caa8079a5362cd0437ec4d74c888077857df1a9c"
    url: "https://github.com/zephyrproject-rtos/zephyr.git"
  nuttx:
    kernel:
      version: "nuttx-12.12.0"
      url: "https://github.com/apache/nuttx.git"
    apps:
      version: "nuttx-12.12.0"
      url: "https://github.com/apache/nuttx-apps.git"

libraries:
  lvgl:
    version: "v9.4.0"
    url: "https://github.com/lvgl/lvgl.git"
  cmsis5:
    version: "5.9.0"
    url: "https://github.com/ARM-software/CMSIS_5.git"
  cmsis-dsp:
    version: "v1.17.0"
    url: "https://github.com/ARM-software/CMSIS-DSP.git"
  tflm:
    version: "f5302ed4fa99b7ec697e578057a1f61445a442fe"
    url: "https://github.com/tensorflow/tflite-micro.git"
  mbedtls:
    version: "v3.6.2"
    url: "https://github.com/Mbed-TLS/mbedtls.git"
  lwip:
    version: "STABLE-2_2_0_RELEASE"
    url: "https://github.com/lwip-tcpip/lwip.git"
