# oveRTOS Component Manifest
# All external component versions are defined here.
# Modifying versions without committing triggers a build warning.

toolchains:
  arm-gnu:
    version: "15.2.rel1"
    url: "https://developer.arm.com/-/media/Files/downloads/gnu/15.2.rel1/binrel/arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi.tar.xz"
  zig:
    version: "0.16.0"
  rust:
    min_version: "1.85"
  zephyr-sdk:
    version: "1.0.1"
  emscripten:
    version: "3.1.51"
    url: "https://github.com/emscripten-core/emsdk.git"

tools:
  # Renode — full-system emulator with STM32F7 peripheral fidelity.
  # Used by `make test-renode-stm32f746-freertos[-zeroheap]` to run the
  # real STM32 HAL + FreeRTOS ARM_CM7 firmware under CI.  Downloaded on
  # demand by `ove download` into `output/tools/renode/`.  If the binary
  # can't be fetched the Renode test handlers self-skip; no other target
  # depends on it.
  renode:
    version: "1.16.1"
    url: "https://github.com/renode/renode/releases/download/v1.16.1/renode-1.16.1.linux-portable.tar.gz"

rtos:
  freertos:
    stm32cubef7:
      version: "v1.17.2"
      url: "https://github.com/STMicroelectronics/STM32CubeF7.git"
    kernel-qemu:
      version: "V11.1.0"
      url: "https://github.com/FreeRTOS/FreeRTOS-Kernel.git"
  zephyr:
    version: "v4.4.0"
    url: "https://github.com/zephyrproject-rtos/zephyr.git"
  nuttx:
    kernel:
      version: "nuttx-12.12.0"
      url: "https://github.com/apache/nuttx.git"
    apps:
      version: "nuttx-12.12.0"
      url: "https://github.com/apache/nuttx-apps.git"

libraries:
  lvgl:
    version: "v9.5.0"
    url: "https://github.com/lvgl/lvgl.git"
  cmsis5:
    version: "5.9.0"
    url: "https://github.com/ARM-software/CMSIS_5.git"
  cmsis-dsp:
    version: "v1.17.0"
    url: "https://github.com/ARM-software/CMSIS-DSP.git"
  tflm:
    version: "f5302ed4fa99b7ec697e578057a1f61445a442fe"
    url: "https://github.com/tensorflow/tflite-micro.git"
  mbedtls:
    version: "v3.6.2"
    url: "https://github.com/Mbed-TLS/mbedtls.git"
  lwip:
    version: "STABLE-2_2_0_RELEASE"
    url: "https://github.com/lwip-tcpip/lwip.git"
  # kcov — coverage collector used by `ove test zig-coverage` (Zig has no
  # native source-based coverage yet; kcov wraps the test binary and
  # emits an lcov tracefile via DWARF + ptrace).
  kcov:
    version: "v43"
    url: "https://github.com/SimonKagstrom/kcov.git"
  # picolibc — unified libc for FreeRTOS (Zephyr builds its own copy from
  # the vendored zephyr-workspace; FreeRTOS pulls picolibc directly here).
  # The arm-gnu-toolchain 15.x distribution we use ships only newlib —
  # no picolibc.specs, no libpicolibc.a — so we build picolibc in-tree
  # against that toolchain via meson and link against the resulting
  # libpicolibc.a.  Pinned to a tag picked for compatibility with the
  # picolibc-freertos.h TLS glue at dl/FreeRTOS-Kernel-*/include/.
  picolibc:
    version: "1.8.10"
    url: "https://github.com/picolibc/picolibc.git"
  # ETL (Embedded Template Library) — header-only, fixed-capacity STL-like
  # containers (vector, string, map, list, deque, …) and utilities.  Pulled
  # only when CONFIG_OVE_APP_LANG_CXX is set; consumed by C++ apps via the
  # `etl::` namespace.  Header-only, MIT-licensed, no build artefacts.
  etl:
    version: "20.47.1"
    url: "https://github.com/ETLCPP/etl.git"
