<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>oveRTOS Sim Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/winbox@0.2.82/dist/css/winbox.min.css"/>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>oveRTOS Simulation Dashboard</h1>
        <div class="header-right">
            <button id="reset-layout" class="btn btn-small" title="Reset window layout">Reset Layout</button>
            <div id="status" class="status disconnected">Disconnected</div>
        </div>
    </header>

    <!-- Panels start hidden; WinBox mount() moves them into windows -->
    <div id="panel-store" style="display:none">
        <section class="panel" id="display-panel">
            <div class="display-container">
                <canvas id="display-canvas"></canvas>
            </div>
            <div class="display-info">
                <span id="display-resolution">--</span>
                <span id="display-fps">-- FPS</span>
            </div>
        </section>

        <section class="panel" id="audio-panel">
            <div class="audio-controls">
                <button id="audio-toggle" class="btn">Enable Audio</button>
                <span id="audio-info">--</span>
            </div>
            <canvas id="audio-waveform" height="100"></canvas>
        </section>

        <section class="panel" id="events-panel">
            <div class="events-toolbar">
                <button id="autoscroll-toggle" class="btn btn-small autoscroll-on" title="Toggle auto-scroll">Auto-scroll: ON</button>
            </div>
            <div id="event-log" class="event-log"></div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/winbox@0.2.82/dist/js/winbox.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
