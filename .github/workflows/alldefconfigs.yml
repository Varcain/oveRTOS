name: Build All Defconfigs

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# Builds every app/*.yaml config for each <board>.<rtos> pair using
# `make allconfigs-<board>.<rtos>`. Splitting per board/rtos keeps disk
# usage bounded on GitHub-hosted runners.

jobs:
  host:
    name: Host POSIX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            cmake build-essential libclang-dev xz-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build allconfigs-host.posix
        run: make allconfigs-host.posix


  qemu-freertos:
    name: QEMU FreeRTOS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            cmake build-essential gcc-arm-none-eabi libnewlib-arm-none-eabi meson ninja-build \
            libclang-dev xz-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache ARM toolchain
        uses: actions/cache@v4
        with:
          path: output/toolchains
          key: arm-toolchain-${{ hashFiles('manifest.yaml') }}

      - name: Build allconfigs-qemu.freertos
        run: make allconfigs-qemu.freertos


  qemu-nuttx:
    name: QEMU NuttX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            cmake build-essential gcc-arm-none-eabi libnewlib-arm-none-eabi meson ninja-build \
            gperf genromfs xxd libclang-dev xz-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache ARM toolchain
        uses: actions/cache@v4
        with:
          path: output/toolchains
          key: arm-toolchain-${{ hashFiles('manifest.yaml') }}

      - name: Build allconfigs-qemu.nuttx
        run: make allconfigs-qemu.nuttx


  qemu-zephyr:
    name: QEMU Zephyr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            cmake build-essential meson ninja-build \
            python3-pip python3-venv device-tree-compiler gperf ccache dfu-util \
            wget xz-utils file libclang-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Zephyr SDK
        run: |
          SDK_VERSION=$(python3 -c "import yaml; print(yaml.safe_load(open('manifest.yaml'))['toolchains']['zephyr-sdk']['version'])")
          wget -q "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${SDK_VERSION}/zephyr-sdk-${SDK_VERSION}_linux-x86_64_minimal.tar.xz"
          tar xf "zephyr-sdk-${SDK_VERSION}_linux-x86_64_minimal.tar.xz" -C $HOME
          "$HOME/zephyr-sdk-${SDK_VERSION}/setup.sh" -t arm-zephyr-eabi -c

      - name: Compute Zephyr cache hash
        id: zephyr-hash
        run: |
          REV=$(python3 -c "import yaml; print(yaml.safe_load(open('manifest.yaml'))['rtos']['zephyr']['version'])")
          HASH=$(python3 -c "import hashlib; print(hashlib.sha256(b'${REV}').hexdigest()[:8])")
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Cache Zephyr workspace
        uses: actions/cache@v5
        with:
          path: dl/zephyr-workspace-${{ steps.zephyr-hash.outputs.hash }}
          key: ove-zephyr-alldefconfigs-qemu-${{ steps.zephyr-hash.outputs.hash }}

      - name: Symlink Zephyr workspace
        run: |
          if [ -d "dl/zephyr-workspace-${{ steps.zephyr-hash.outputs.hash }}/zephyr" ]; then
            ln -sfn "zephyr-workspace-${{ steps.zephyr-hash.outputs.hash }}" dl/zephyr-workspace
            echo "Zephyr workspace restored from cache"
          fi

      - name: Build allconfigs-qemu.zephyr
        run: make allconfigs-qemu.zephyr


  stm32f746-freertos:
    name: STM32F746 FreeRTOS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            cmake build-essential gcc-arm-none-eabi libnewlib-arm-none-eabi meson ninja-build \
            libclang-dev xz-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache ARM toolchain
        uses: actions/cache@v4
        with:
          path: output/toolchains
          key: arm-toolchain-${{ hashFiles('manifest.yaml') }}

      - name: Build allconfigs-stm32f746.freertos
        run: make allconfigs-stm32f746.freertos


  stm32f746-nuttx:
    name: STM32F746 NuttX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            cmake build-essential gcc-arm-none-eabi libnewlib-arm-none-eabi meson ninja-build \
            gperf genromfs xxd libclang-dev xz-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache ARM toolchain
        uses: actions/cache@v4
        with:
          path: output/toolchains
          key: arm-toolchain-${{ hashFiles('manifest.yaml') }}

      - name: Build allconfigs-stm32f746.nuttx
        # OVE_BUILD_JOBS=2: ubuntu-latest's 7 GB RAM can't sustain four
        # parallel TFLM C++ template compiles (`_keyword_live_*` apps),
        # so the runner OOM-kills mid-build. Halving parallelism keeps
        # the peak working set under the limit.
        env:
          OVE_BUILD_JOBS: "2"
        run: make allconfigs-stm32f746.nuttx


  stm32f746-zephyr:
    name: STM32F746 Zephyr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            cmake build-essential meson ninja-build \
            python3-pip python3-venv device-tree-compiler gperf ccache dfu-util \
            wget xz-utils file libclang-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Zephyr SDK
        run: |
          SDK_VERSION=$(python3 -c "import yaml; print(yaml.safe_load(open('manifest.yaml'))['toolchains']['zephyr-sdk']['version'])")
          wget -q "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${SDK_VERSION}/zephyr-sdk-${SDK_VERSION}_linux-x86_64_minimal.tar.xz"
          tar xf "zephyr-sdk-${SDK_VERSION}_linux-x86_64_minimal.tar.xz" -C $HOME
          "$HOME/zephyr-sdk-${SDK_VERSION}/setup.sh" -t arm-zephyr-eabi -c

      - name: Compute Zephyr cache hash
        id: zephyr-hash
        run: |
          REV=$(python3 -c "import yaml; print(yaml.safe_load(open('manifest.yaml'))['rtos']['zephyr']['version'])")
          HASH=$(python3 -c "import hashlib; print(hashlib.sha256(b'${REV}').hexdigest()[:8])")
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Cache Zephyr workspace
        uses: actions/cache@v5
        with:
          path: dl/zephyr-workspace-${{ steps.zephyr-hash.outputs.hash }}
          key: ove-zephyr-alldefconfigs-stm32f746-${{ steps.zephyr-hash.outputs.hash }}

      - name: Symlink Zephyr workspace
        run: |
          if [ -d "dl/zephyr-workspace-${{ steps.zephyr-hash.outputs.hash }}/zephyr" ]; then
            ln -sfn "zephyr-workspace-${{ steps.zephyr-hash.outputs.hash }}" dl/zephyr-workspace
            echo "Zephyr workspace restored from cache"
          fi

      - name: Build allconfigs-stm32f746.zephyr
        run: make allconfigs-stm32f746.zephyr
