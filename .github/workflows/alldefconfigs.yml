name: Build All Defconfigs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: Host POSIX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            cmake build-essential libsdl2-dev libclang-dev xz-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build all host defconfigs
        run: |
          FAILED=""
          CONFIGS=$(find defconfigs/host -name '*_defconfig' -type f | sort)
          TOTAL=$(echo "$CONFIGS" | wc -l)
          CURRENT=0
          for cfg in $CONFIGS; do
            NAME=$(basename $cfg)
            CURRENT=$((CURRENT + 1))
            echo "============================================================"
            echo "[$CURRENT/$TOTAL] Building $NAME"
            echo "============================================================"
            if make $NAME && make; then
              echo "[$CURRENT/$TOTAL] $NAME: OK"
            else
              echo "[$CURRENT/$TOTAL] $NAME: FAILED"
              FAILED="$FAILED $NAME"
            fi
          done
          echo ""
          echo "============================================================"
          echo "host: $TOTAL configurations processed"
          if [ -n "$FAILED" ]; then
            echo "FAILED:$FAILED"
            exit 1
          else
            echo "All host configurations built successfully"
          fi


  qemu-freertos:
    name: QEMU FreeRTOS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            cmake build-essential gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libclang-dev xz-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache ARM toolchain
        uses: actions/cache@v4
        with:
          path: output/toolchains
          key: arm-toolchain-${{ hashFiles('manifest.yaml') }}

      - name: Build all qemu-freertos defconfigs
        run: |
          FAILED=""
          CONFIGS=$(find defconfigs/qemu -name 'qemu_freertos_*_defconfig' -type f | sort)
          TOTAL=$(echo "$CONFIGS" | wc -l)
          CURRENT=0
          for cfg in $CONFIGS; do
            NAME=$(basename $cfg)
            CURRENT=$((CURRENT + 1))
            echo "============================================================"
            echo "[$CURRENT/$TOTAL] Building $NAME"
            echo "============================================================"
            if make $NAME && make; then
              echo "[$CURRENT/$TOTAL] $NAME: OK"
            else
              echo "[$CURRENT/$TOTAL] $NAME: FAILED"
              FAILED="$FAILED $NAME"
            fi
          done
          echo ""
          echo "============================================================"
          echo "qemu-freertos: $TOTAL configurations processed"
          if [ -n "$FAILED" ]; then
            echo "FAILED:$FAILED"
            exit 1
          else
            echo "All qemu-freertos configurations built successfully"
          fi


