name: oveRTOS Tests

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (fast-fail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            python3 python3-venv cmake build-essential \
            clang-format clang-tidy
          python3 -m pip install --user ruff

      - name: Install Rust (for cargo fmt / cargo clippy)
        # `rust-src` is listed alongside rustfmt/clippy because the repo's
        # rust-toolchain.toml requires it; without pre-installation here,
        # any cargo invocation under `make lint` triggers a rustup auto-
        # install of rust-src which fails on the runner-cached toolchain
        # with `detected conflict: Cargo.lock`, breaking cargo fmt and
        # cargo clippy at startup.
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, rust-src

      - name: Bootstrap oveRTOS venv
        run: make setup

      - name: Run ove lint
        run: make lint

  stub-tests:
    name: Stub Backend Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Run tests
        run: make test-stub

      - name: Run native SPI retirement regression tests
        run: ctest --test-dir output/tests/stub -R 'ove_test_spi_retire_' --output-on-failure

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: stub-tests-logs
          path: output/
          retention-days: 7

  sync-condvar:
    name: Synchronization Boundary Models
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential python3-venv
      - name: Run ordinary and sanitizer models
        run: |
          timeout --signal=INT --kill-after=30 300 make test-sync-condvar
          timeout --signal=INT --kill-after=30 300 make test-sync-condvar-sanitize
          timeout --signal=INT --kill-after=30 660 make test-freertos-cv-context
          timeout --signal=INT --kill-after=30 660 make test-freertos-cv-context-sanitize
          timeout --signal=INT --kill-after=30 300 make test-sync-contracts
          timeout --signal=INT --kill-after=30 300 make test-sync-contracts-sanitize
          timeout --signal=INT --kill-after=30 360 make test-queue-contracts
          timeout --signal=INT --kill-after=30 360 make test-queue-contracts-sanitize
          timeout --signal=INT --kill-after=30 600 make test-eventgroup-contracts
          timeout --signal=INT --kill-after=30 600 make test-eventgroup-contracts-sanitize
          timeout --signal=INT --kill-after=30 660 make test-freertos-timeouts
          timeout --signal=INT --kill-after=30 660 make test-freertos-timeouts-sanitize
          timeout --signal=INT --kill-after=30 480 make test-freertos-event-timeouts
          timeout --signal=INT --kill-after=30 480 make test-freertos-event-timeouts-sanitize
          timeout --signal=INT --kill-after=30 720 make test-freertos-event-waiters
          timeout --signal=INT --kill-after=30 720 make test-freertos-event-waiters-sanitize
          timeout --signal=INT --kill-after=30 420 make test-nuttx-timeouts
          timeout --signal=INT --kill-after=30 420 make test-nuttx-timeouts-sanitize
          timeout --signal=INT --kill-after=30 360 make test-eventgroup-scalar
          timeout --signal=INT --kill-after=30 360 make test-eventgroup-scalar-sanitize
          timeout --signal=INT --kill-after=30 360 make test-eventgroup-deferred
          timeout --signal=INT --kill-after=30 360 make test-eventgroup-deferred-sanitize

  stub-sanitize:
    name: C Stub Sanitize (UBSan + ASan)
    runs-on: ubuntu-latest
    needs: stub-tests
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Run tests under sanitizers
        run: make test-stub-sanitize

      - name: Run zero-heap tests under sanitizers
        run: make test-stub-sanitize-zh

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: stub-sanitize-logs
          path: output/
          retention-days: 7

  stub-msan:
    name: C Stub MSan (uninitialized-memory detector)
    runs-on: ubuntu-latest
    needs: stub-tests
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential clang

      - name: Run tests under MSan
        run: make test-stub-msan

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: stub-msan-logs
          path: output/
          retention-days: 7

  stub-tsan:
    name: C Stub TSan (data-race detector)
    runs-on: ubuntu-latest
    needs: stub-tests
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Run tests under TSan
        run: make test-stub-tsan

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: stub-tsan-logs
          path: output/
          retention-days: 7

  cpp-tests:
    name: C++ Wrapper Tests
    runs-on: ubuntu-latest
    needs: stub-tests
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Run tests
        run: make test-cpp

      - name: Run inference storage tests (both heap modes)
        run: timeout --signal=INT --kill-after=30 300 make test-cpp-infer

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cpp-tests-logs
          path: output/
          retention-days: 7

  cpp-sanitize:
    name: C++ Sanitize (UBSan + ASan)
    runs-on: ubuntu-latest
    needs: stub-tests
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Run tests under sanitizers
        run: make test-cpp-sanitize

      - name: Run zero-heap tests under sanitizers
        run: make test-cpp-sanitize-zh

      - name: Run inference storage tests under sanitizers (both heap modes)
        run: timeout --signal=INT --kill-after=30 300 make test-cpp-infer-sanitize

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cpp-sanitize-logs
          path: output/
          retention-days: 7

  cpp-tsan:
    name: C++ TSan (data-race detector)
    runs-on: ubuntu-latest
    needs: stub-tests
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Run C++ tests under TSan
        run: make test-cpp-tsan

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cpp-tsan-logs
          path: output/
          retention-days: 7

  rust-tests:
    name: Rust Wrapper Tests
    runs-on: ubuntu-latest
    needs: stub-tests
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libclang-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src
          targets: thumbv7em-none-eabihf, thumbv7em-none-eabi, thumbv7m-none-eabi

      - name: Run tests
        run: make test-rust

      - name: Run zero-heap tests
        run: make test-rust-zeroheap

      - name: Native Rust bindings in no_std, alloc and std modes
        run: timeout --signal=INT --kill-after=30 720 make test-rust-native-core

      - name: Run scoped Rust synchronization contracts and sanitizers
        run: timeout --signal=INT --kill-after=30 1200 make test-rust-scoped test-rust-scoped-sanitize
      - name: Rust semaphore and event ownership contracts
        run: timeout --signal=INT --kill-after=30 1200 make test-rust-sync test-rust-sync-sanitize
      - name: Rust Queue ownership and context contracts
        run: timeout --signal=INT --kill-after=30 1500 make test-rust-queue test-rust-queue-sanitize
      - name: Rust EventGroup ownership and context
        run: timeout --signal=INT --kill-after=30 1500 make test-rust-eventgroup test-rust-eventgroup-sanitize
      - name: Async semaphore setup and wake callbacks
        run: timeout --signal=INT --kill-after=30 1200 make test-rust-async-sem test-rust-async-sem-sanitize
      - name: Async Queue setup and wake callbacks
        run: timeout --signal=INT --kill-after=30 1200 make test-rust-async-queue test-rust-async-queue-sanitize

      - name: Scoped SpinMutex ownership and native key cleanup
        run: timeout --signal=INT --kill-after=30 1200 make test-rust-spinmutex test-rust-spinmutex-sanitize

      - name: FreeRTOS IRQ masks and Rust caller admission
        run: timeout --signal=INT --kill-after=30 2100 make test-freertos-irq-masks test-freertos-irq-masks-sanitize test-freertos-irq-bindings test-freertos-irq-bindings-sanitize

      - name: Run typed Rust SPI tests (both heap modes)
        run: make test-rust-spi

      - name: Run Rust inference ownership tests (both heap modes and sanitizers)
        run: timeout 1200 make test-rust-infer test-rust-infer-sanitize

      - name: Run synchronous Rust I2C tests (both heap modes, optional clocks and console)
        run: make test-rust-i2c

      - name: Run owned async Rust SPI tests (both heap modes)
        run: make test-rust-async-spi
      - name: Rust async I2C ownership and staging
        run: make test-rust-async-i2c

      - name: Native inference session admission
        run: timeout 1200 make test-infer-admission test-infer-admission-sanitize

      - name: Fetch LVGL (manifest-pinned) into dl/lvgl
        run: |
          LVGL_URL=$(python3 scripts/manifest_query.py libraries.lvgl.url)
          LVGL_TAG=$(python3 scripts/manifest_query.py libraries.lvgl.version)
          git clone --depth 1 --branch "$LVGL_TAG" "$LVGL_URL" dl/lvgl

      - name: Run real LVGL ownership and Canvas tests
        run: timeout 1200 make test-rust-lvgl test-rust-lvgl-sanitize

      - name: Fetch mbedTLS (manifest-pinned) into dl/mbedtls
        run: |
          MBEDTLS_URL=$(python3 scripts/manifest_query.py libraries.mbedtls.url)
          MBEDTLS_TAG=$(python3 scripts/manifest_query.py libraries.mbedtls.version)
          git clone --depth 1 --branch "$MBEDTLS_TAG" --recurse-submodules --shallow-submodules "$MBEDTLS_URL" dl/mbedtls

      - name: Run real native Rust string tests (both heap modes)
        run: make test-rust-strings

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rust-tests-logs
          path: output/
          retention-days: 7

  rust-miri:
    name: Rust Miri (UB detector)
    runs-on: ubuntu-latest
    needs: stub-tests
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install Rust nightly with Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src

      - name: Run Miri on binding's pure-Rust unit tests
        run: make miri

  zig-tests:
    name: Zig Wrapper Tests
    runs-on: ubuntu-latest
    needs: stub-tests
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential xz-utils

      - name: Run tests
        run: make test-zig

      - name: Run zero-heap tests
        run: make test-zig-zeroheap

      - name: Run inference assets and storage tests (both modes, four optimizations)
        run: timeout --signal=INT --kill-after=30 1200 make test-zig-infer

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: zig-tests-logs
          path: output/
          retention-days: 7

  zig-debug:
    name: Zig Debug-mode Tests (tighter safety checks)
    runs-on: ubuntu-latest
    needs: stub-tests
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential xz-utils

      - name: Run tests in -ODebug
        run: make test-zig-debug

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: zig-debug-logs
          path: output/
          retention-days: 7

  lvgl-bindings-compile:
    name: LVGL Bindings Compile (vs real LVGL)
    runs-on: ubuntu-latest
    needs: stub-tests
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      # Needs every binding toolchain at once: g++ (C++), cmake+libclang
      # (Rust stub build + bindgen), and the Zig toolchain (fetched by the
      # target itself). Unlike the stub-based binding jobs, this one
      # compiles against real LVGL, so it must fetch dl/lvgl below.
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libclang-dev xz-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src

      - name: Fetch LVGL (manifest-pinned) into dl/lvgl
        run: |
          LVGL_URL=$(python3 scripts/manifest_query.py libraries.lvgl.url)
          LVGL_TAG=$(python3 scripts/manifest_query.py libraries.lvgl.version)
          git clone --depth 1 --branch "$LVGL_TAG" "$LVGL_URL" dl/lvgl

      - name: Compile-check bindings against real LVGL
        run: make test-lvgl-compile

      - name: Check EventGroup public bindings
        run: timeout --signal=INT --kill-after=30 660 make test-eventgroup-bindings

      - name: Check shared Event public bindings
        run: timeout --signal=INT --kill-after=30 1200 make test-freertos-event-bindings

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lvgl-bindings-compile-logs
          path: output/
          retention-days: 7

  nuttx-sim-tests:
    name: NuttX Simulator Tests
    runs-on: ubuntu-latest
    needs: stub-tests
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y cmake build-essential \
            gperf genromfs xxd python3-pip python3-venv qemu-system-arm

      - name: Run tests
        run: timeout 600 make test-nuttx

      - name: Run constructor startup tests
        run: timeout 600 make test-nuttx-startup

      - name: Run native SPI retirement tests
        run: timeout 600 make test-spi-retirement-nuttx

      - name: I2C retirement (nuttx)
        run: timeout 1200 make test-i2c-retirement-nuttx

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: nuttx-sim-tests-logs
          path: output/
          retention-days: 7

  zephyr-sim-tests:
    name: Zephyr native and ARM Tests
    runs-on: ubuntu-latest
    needs: stub-tests
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y cmake build-essential meson ninja-build \
            python3-pip python3-venv device-tree-compiler gperf ccache dfu-util \
            wget xz-utils file qemu-system-arm

      - name: Compute Zephyr cache hash
        id: zephyr-hash
        run: |
          HASH=$(python3 scripts/manifest_query.py --hash rtos.zephyr.version)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Cache Zephyr workspace
        uses: actions/cache@v5
        with:
          path: dl/zephyr-workspace-${{ steps.zephyr-hash.outputs.hash }}
          key: ove-zephyr-${{ steps.zephyr-hash.outputs.hash }}

      - name: Symlink Zephyr workspace
        run: |
          if [ -d "dl/zephyr-workspace-${{ steps.zephyr-hash.outputs.hash }}/zephyr" ]; then
            ln -sfn "zephyr-workspace-${{ steps.zephyr-hash.outputs.hash }}" dl/zephyr-workspace
            echo "Zephyr workspace restored from cache"
          fi

      - name: Run real Zephyr SPI retirement tests
        run: make test-spi-retirement-zephyr

      - name: Run native Zephyr I2C boundary tests
        run: make test-i2c-native-zephyr

      - name: I2C retirement (zephyr)
        run: timeout 1200 make test-i2c-retirement-zephyr

      - name: Run tests
        run: timeout 600 make test-zephyr

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: zephyr-sim-tests-logs
          path: output/
          retention-days: 7

  qemu-freertos-tests:
    name: QEMU FreeRTOS Tests
    runs-on: ubuntu-latest
    needs: stub-tests
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            cmake build-essential qemu-system-arm gcc-arm-none-eabi libnewlib-arm-none-eabi meson ninja-build libclang-dev

      - name: Install Rust for SPI executor stack tests
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf

      - name: Cache ARM toolchain
        uses: actions/cache@v4
        with:
          path: output/toolchains
          key: arm-toolchain-${{ hashFiles('manifest.yaml') }}

      # The build pulls FreeRTOS-Kernel and cmocka via CMake FetchContent
      # at configure time (no `dl/` pre-cache for this variant), so the
      # wall-clock ceiling has to absorb GitHub/GitLab clone slowdowns.
      # A previous run hit a ~8 min github.com stall on a single shallow
      # clone after apt-get itself ran at 2 MB/s — well past the 600 s
      # budget despite the actual build+test taking ~3 min when warm.
      - name: Run tests
        run: timeout 1200 make test-qemu-freertos

      - name: Run zeroheap tests
        run: timeout 1200 make test-qemu-freertos-zeroheap

      - name: Check EventGroup deferred interrupt delivery and task access
        run: timeout --signal=INT --kill-after=30 960 make test-eventgroup-deferred-arm

      - name: Native Event timeout and caller-mode controls
        run: timeout --signal=INT --kill-after=30 1320 make test-freertos-event-timeouts-arm

      - name: Native shared Event waits and interrupt-mask restoration
        run: timeout --signal=INT --kill-after=30 1320 make test-freertos-event-waiters-arm

      - name: Native condition-variable caller mode and foreign stacks
        run: timeout --signal=INT --kill-after=30 1320 make test-freertos-cv-context-arm

      - name: Qualify shipped inference models on Cortex-M7
        run: timeout --kill-after=20 1500 make test-infer-target

      - name: Run real FreeRTOS SPI retirement tests
        run: timeout 1200 make test-spi-retirement-freertos

      - name: Run Rust SPI and Embassy callback stack tests
        run: timeout 1200 make test-rust-async-spi-arm
      - name: Rust async I2C on Cortex-M7
        run: timeout 1200 make test-rust-async-i2c-arm

      - name: Run native STM32 I2C count tests
        run: timeout 1200 make test-i2c-native-arm

      - name: I2C retirement (freertos)
        run: timeout 1200 make test-i2c-retirement-freertos

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: qemu-freertos-tests-logs
          path: output/
          retention-days: 7

  renode-stm32f746-tests:
    name: Renode STM32F746 Tests
    runs-on: ubuntu-latest
    needs: stub-tests
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            cmake build-essential libicu74 meson ninja-build

      - name: Cache ARM toolchain
        uses: actions/cache@v4
        with:
          path: output/toolchains
          key: arm-toolchain-${{ hashFiles('manifest.yaml') }}

      - name: Cache Renode portable
        uses: actions/cache@v4
        with:
          path: output/tools/renode
          key: renode-1.16.1-portable-v1

      - name: Run heap tests
        run: timeout 600 make test-renode-stm32f746-freertos

      - name: Run zero-heap tests
        run: timeout 600 make test-renode-stm32f746-freertos-zeroheap

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: renode-stm32f746-tests-logs
          path: |
            output/tests/renode-stm32f746-freertos*/uart.log
            output/tests/renode-stm32f746-freertos*/renode.log
          retention-days: 7

  qemu-nuttx-tests:
    name: QEMU NuttX Tests
    runs-on: ubuntu-latest
    needs: stub-tests
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            cmake build-essential qemu-system-arm gcc-arm-none-eabi libnewlib-arm-none-eabi meson ninja-build \
            gperf genromfs xxd python3-pip python3-venv

      - name: Cache ARM toolchain
        uses: actions/cache@v4
        with:
          path: output/toolchains
          key: arm-toolchain-${{ hashFiles('manifest.yaml') }}

      - name: Run tests
        run: timeout 900 make test-qemu-nuttx

      - name: Run zeroheap tests
        run: timeout 900 make test-qemu-nuttx-zeroheap

      - name: Run cpuload tests
        run: timeout 900 make test-qemu-nuttx-cpuload

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: qemu-nuttx-tests-logs
          path: output/
          retention-days: 7

  qemu-zephyr-tests:
    name: QEMU Zephyr Tests
    runs-on: ubuntu-latest
    needs: stub-tests
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            cmake build-essential meson ninja-build qemu-system-arm \
            python3-pip python3-venv device-tree-compiler gperf ccache dfu-util \
            wget xz-utils file

      - name: Compute Zephyr cache hash
        id: zephyr-hash
        run: |
          HASH=$(python3 scripts/manifest_query.py --hash rtos.zephyr.version)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Cache Zephyr workspace
        uses: actions/cache@v5
        with:
          path: dl/zephyr-workspace-${{ steps.zephyr-hash.outputs.hash }}
          key: ove-zephyr-qemu-${{ steps.zephyr-hash.outputs.hash }}

      - name: Symlink Zephyr workspace
        run: |
          if [ -d "dl/zephyr-workspace-${{ steps.zephyr-hash.outputs.hash }}/zephyr" ]; then
            ln -sfn "zephyr-workspace-${{ steps.zephyr-hash.outputs.hash }}" dl/zephyr-workspace
            echo "Zephyr workspace restored from cache"
          fi

      - name: Run tests
        run: timeout 600 make test-qemu-zephyr

      - name: Run zeroheap tests
        run: timeout 600 make test-qemu-zephyr-zeroheap

      - name: Check EventGroup native user access
        run: timeout --signal=INT --kill-after=30 600 make test-eventgroup-user

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: qemu-zephyr-tests-logs
          path: output/
          retention-days: 7
