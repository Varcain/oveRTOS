name: oveRTOS Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (fast-fail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            python3 python3-venv cmake build-essential \
            clang-format clang-tidy
          python3 -m pip install --user ruff

      - name: Install Rust (for cargo fmt / cargo clippy)
        # `rust-src` is listed alongside rustfmt/clippy because the repo's
        # rust-toolchain.toml requires it; without pre-installation here,
        # any cargo invocation under `make lint` triggers a rustup auto-
        # install of rust-src which fails on the runner-cached toolchain
        # with `detected conflict: Cargo.lock`, breaking cargo fmt and
        # cargo clippy at startup.
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, rust-src

      - name: Bootstrap oveRTOS venv
        run: make setup

      - name: Run ove lint
        run: make lint

  stub-tests:
    name: Stub Backend Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Run tests
        run: make test-stub

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: stub-tests-logs
          path: output/
          retention-days: 7

  stub-sanitize:
    name: C Stub Sanitize (UBSan + ASan)
    runs-on: ubuntu-latest
    needs: stub-tests
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Run tests under sanitizers
        run: make test-stub-sanitize

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: stub-sanitize-logs
          path: output/
          retention-days: 7

  stub-msan:
    name: C Stub MSan (uninitialized-memory detector)
    runs-on: ubuntu-latest
    needs: stub-tests
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential clang

      - name: Run tests under MSan
        run: make test-stub-msan

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: stub-msan-logs
          path: output/
          retention-days: 7

  stub-tsan:
    name: C Stub TSan (data-race detector)
    runs-on: ubuntu-latest
    needs: stub-tests
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Run tests under TSan
        run: make test-stub-tsan

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: stub-tsan-logs
          path: output/
          retention-days: 7

  cpp-tests:
    name: C++ Wrapper Tests
    runs-on: ubuntu-latest
    needs: stub-tests
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Run tests
        run: make test-cpp

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cpp-tests-logs
          path: output/
          retention-days: 7

  cpp-sanitize:
    name: C++ Sanitize (UBSan + ASan)
    runs-on: ubuntu-latest
    needs: stub-tests
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Run tests under sanitizers
        run: make test-cpp-sanitize

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cpp-sanitize-logs
          path: output/
          retention-days: 7

  cpp-tsan:
    name: C++ TSan (data-race detector)
    runs-on: ubuntu-latest
    needs: stub-tests
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Run C++ tests under TSan
        run: make test-cpp-tsan

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cpp-tsan-logs
          path: output/
          retention-days: 7

  rust-tests:
    name: Rust Wrapper Tests
    runs-on: ubuntu-latest
    needs: stub-tests
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libclang-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src
          targets: thumbv7em-none-eabihf, thumbv7em-none-eabi, thumbv7m-none-eabi

      - name: Run tests
        run: make test-rust

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rust-tests-logs
          path: output/
          retention-days: 7

  rust-miri:
    name: Rust Miri (UB detector)
    runs-on: ubuntu-latest
    needs: stub-tests
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust nightly with Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src

      - name: Run Miri on binding's pure-Rust unit tests
        run: make miri

  zig-tests:
    name: Zig Wrapper Tests
    runs-on: ubuntu-latest
    needs: stub-tests
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential xz-utils

      - name: Run tests
        run: make test-zig

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: zig-tests-logs
          path: output/
          retention-days: 7

  zig-debug:
    name: Zig Debug-mode Tests (tighter safety checks)
    runs-on: ubuntu-latest
    needs: stub-tests
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential xz-utils

      - name: Run tests in -ODebug
        run: make test-zig-debug

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: zig-debug-logs
          path: output/
          retention-days: 7

  nuttx-sim-tests:
    name: NuttX Simulator Tests
    runs-on: ubuntu-latest
    needs: stub-tests
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y cmake build-essential \
            gperf genromfs xxd python3-pip python3-venv

      - name: Run tests
        run: timeout 600 make test-nuttx

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: nuttx-sim-tests-logs
          path: output/
          retention-days: 7

  zephyr-sim-tests:
    name: Zephyr native_sim Tests
    runs-on: ubuntu-latest
    needs: stub-tests
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y cmake build-essential meson ninja-build \
            python3-pip python3-venv device-tree-compiler gperf ccache dfu-util \
            wget xz-utils file

      - name: Compute Zephyr cache hash
        id: zephyr-hash
        run: |
          HASH=$(python3 scripts/manifest_query.py --hash rtos.zephyr.version)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Cache Zephyr workspace
        uses: actions/cache@v5
        with:
          path: dl/zephyr-workspace-${{ steps.zephyr-hash.outputs.hash }}
          key: ove-zephyr-${{ steps.zephyr-hash.outputs.hash }}

      - name: Symlink Zephyr workspace
        run: |
          if [ -d "dl/zephyr-workspace-${{ steps.zephyr-hash.outputs.hash }}/zephyr" ]; then
            ln -sfn "zephyr-workspace-${{ steps.zephyr-hash.outputs.hash }}" dl/zephyr-workspace
            echo "Zephyr workspace restored from cache"
          fi

      - name: Run tests
        run: timeout 600 make test-zephyr

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: zephyr-sim-tests-logs
          path: output/
          retention-days: 7

  qemu-freertos-tests:
    name: QEMU FreeRTOS Tests
    runs-on: ubuntu-latest
    needs: stub-tests
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            cmake build-essential qemu-system-arm gcc-arm-none-eabi libnewlib-arm-none-eabi meson ninja-build

      - name: Cache ARM toolchain
        uses: actions/cache@v4
        with:
          path: output/toolchains
          key: arm-toolchain-${{ hashFiles('manifest.yaml') }}

      # The build pulls FreeRTOS-Kernel and cmocka via CMake FetchContent
      # at configure time (no `dl/` pre-cache for this variant), so the
      # wall-clock ceiling has to absorb GitHub/GitLab clone slowdowns.
      # A previous run hit a ~8 min github.com stall on a single shallow
      # clone after apt-get itself ran at 2 MB/s — well past the 600 s
      # budget despite the actual build+test taking ~3 min when warm.
      - name: Run tests
        run: timeout 1200 make test-qemu-freertos

      - name: Run zeroheap tests
        run: timeout 1200 make test-qemu-freertos-zeroheap

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: qemu-freertos-tests-logs
          path: output/
          retention-days: 7

  renode-stm32f746-tests:
    name: Renode STM32F746 Tests
    runs-on: ubuntu-latest
    needs: stub-tests
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            cmake build-essential libicu74 meson ninja-build

      - name: Cache ARM toolchain
        uses: actions/cache@v4
        with:
          path: output/toolchains
          key: arm-toolchain-${{ hashFiles('manifest.yaml') }}

      - name: Cache Renode portable
        uses: actions/cache@v4
        with:
          path: output/tools/renode
          key: renode-1.16.1-portable-v1

      - name: Run heap tests
        run: timeout 600 make test-renode-stm32f746-freertos

      - name: Run zero-heap tests
        run: timeout 600 make test-renode-stm32f746-freertos-zeroheap

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: renode-stm32f746-tests-logs
          path: |
            output/tests/renode-stm32f746-freertos*/uart.log
            output/tests/renode-stm32f746-freertos*/renode.log
          retention-days: 7

  qemu-nuttx-tests:
    name: QEMU NuttX Tests
    runs-on: ubuntu-latest
    needs: stub-tests
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            cmake build-essential qemu-system-arm gcc-arm-none-eabi libnewlib-arm-none-eabi meson ninja-build \
            gperf genromfs xxd python3-pip python3-venv

      - name: Cache ARM toolchain
        uses: actions/cache@v4
        with:
          path: output/toolchains
          key: arm-toolchain-${{ hashFiles('manifest.yaml') }}

      - name: Run tests
        run: timeout 900 make test-qemu-nuttx

      - name: Run zeroheap tests
        run: timeout 900 make test-qemu-nuttx-zeroheap

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: qemu-nuttx-tests-logs
          path: output/
          retention-days: 7

  qemu-zephyr-tests:
    name: QEMU Zephyr Tests
    runs-on: ubuntu-latest
    needs: stub-tests
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            cmake build-essential meson ninja-build qemu-system-arm \
            python3-pip python3-venv device-tree-compiler gperf ccache dfu-util \
            wget xz-utils file

      - name: Install Zephyr SDK
        run: |
          SDK_VERSION=$(python3 scripts/manifest_query.py toolchains.zephyr-sdk.version)
          wget -q "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${SDK_VERSION}/zephyr-sdk-${SDK_VERSION}_linux-x86_64_minimal.tar.xz"
          tar xf "zephyr-sdk-${SDK_VERSION}_linux-x86_64_minimal.tar.xz" -C $HOME
          "$HOME/zephyr-sdk-${SDK_VERSION}/setup.sh" -t arm-zephyr-eabi -c

      - name: Compute Zephyr cache hash
        id: zephyr-hash
        run: |
          HASH=$(python3 scripts/manifest_query.py --hash rtos.zephyr.version)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Cache Zephyr workspace
        uses: actions/cache@v5
        with:
          path: dl/zephyr-workspace-${{ steps.zephyr-hash.outputs.hash }}
          key: ove-zephyr-qemu-${{ steps.zephyr-hash.outputs.hash }}

      - name: Symlink Zephyr workspace
        run: |
          if [ -d "dl/zephyr-workspace-${{ steps.zephyr-hash.outputs.hash }}/zephyr" ]; then
            ln -sfn "zephyr-workspace-${{ steps.zephyr-hash.outputs.hash }}" dl/zephyr-workspace
            echo "Zephyr workspace restored from cache"
          fi

      - name: Run tests
        run: timeout 600 make test-qemu-zephyr

      - name: Run zeroheap tests
        run: timeout 600 make test-qemu-zephyr-zeroheap

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: qemu-zephyr-tests-logs
          path: output/
          retention-days: 7
