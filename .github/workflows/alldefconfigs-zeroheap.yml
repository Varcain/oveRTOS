name: Build All Defconfigs (ZEROHEAP)

on:
  workflow_dispatch:

permissions:
  contents: read

# Reusable build loop: configure each app via fragments with ZEROHEAP=1, then build.
# APPS is discovered from apps/*/app.yaml and apps/*/*/app.yaml config_name fields.
# Zig apps are skipped on WASM (wasm32-emscripten not supported in Zig 0.15).

jobs:
  host:
    name: Host POSIX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            cmake build-essential libclang-dev xz-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build all host/posix apps (ZEROHEAP)
        run: |
          APPS=$(grep -rh 'config_name:' apps/*/app.yaml apps/*/*/app.yaml 2>/dev/null \
                 | sed 's/.*config_name: *//' | sort -u)
          FAILED=""
          TOTAL=0
          for app in $APPS; do
            TOTAL=$((TOTAL + 1))
            echo ""
            echo "============================================================"
            echo "[$TOTAL] Building host.posix.$app ZEROHEAP=1"
            echo "============================================================"
            if make "host.posix.$app" ZEROHEAP=1 && make; then
              echo "[$TOTAL] host.posix.$app ZEROHEAP=1: OK"
            else
              echo "[$TOTAL] host.posix.$app ZEROHEAP=1: FAILED"
              FAILED="$FAILED $app"
            fi
          done
          echo ""
          echo "============================================================"
          echo "host/posix (ZEROHEAP): $TOTAL configurations processed"
          if [ -n "$FAILED" ]; then
            echo "FAILED:$FAILED"
            exit 1
          else
            echo "All configurations built successfully"
          fi


  qemu-freertos:
    name: QEMU FreeRTOS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            cmake build-essential gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libclang-dev xz-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache ARM toolchain
        uses: actions/cache@v4
        with:
          path: output/toolchains
          key: arm-toolchain-${{ hashFiles('manifest.yaml') }}

      - name: Build all qemu/freertos apps (ZEROHEAP)
        run: |
          APPS=$(grep -rh 'config_name:' apps/*/app.yaml apps/*/*/app.yaml 2>/dev/null \
                 | sed 's/.*config_name: *//' | sort -u)
          FAILED=""
          TOTAL=0
          for app in $APPS; do
            TOTAL=$((TOTAL + 1))
            echo ""
            echo "============================================================"
            echo "[$TOTAL] Building qemu.freertos.$app ZEROHEAP=1"
            echo "============================================================"
            if make "qemu.freertos.$app" ZEROHEAP=1 && make; then
              echo "[$TOTAL] qemu.freertos.$app ZEROHEAP=1: OK"
            else
              echo "[$TOTAL] qemu.freertos.$app ZEROHEAP=1: FAILED"
              FAILED="$FAILED $app"
            fi
          done
          echo ""
          echo "============================================================"
          echo "qemu/freertos (ZEROHEAP): $TOTAL configurations processed"
          if [ -n "$FAILED" ]; then
