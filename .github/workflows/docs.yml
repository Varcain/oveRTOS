name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Doxygen
        run: sudo apt-get install -y doxygen

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs
        run: pip install mkdocs-material

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build documentation
        run: make docs

      # ── WASM live demo ──────────────────────────────────────
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.51'

      - name: Build WASM example_c
        run: |
          make wasm_posix_example_c_defconfig
          make configure
          make download
          make

      - name: Add WASM apps to docs site
        run: |
          COMMON="sim/dashboard/app.js sim/dashboard/style.css sim/dashboard/coi-serviceworker.js"

          # example_c → /example_c/
          mkdir -p docs-site/site/example_c
          cp output/wasm/posix/example_c/build/firmware/ove_wasm.html docs-site/site/example_c/index.html
          cp output/wasm/posix/example_c/build/firmware/ove_wasm.js docs-site/site/example_c/
          cp output/wasm/posix/example_c/build/firmware/ove_wasm.wasm docs-site/site/example_c/
          cp output/wasm/posix/example_c/build/firmware/ove_wasm.worker.js docs-site/site/example_c/ 2>/dev/null || true
          for f in $COMMON; do cp "$f" docs-site/site/example_c/; done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/site

  deploy:
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
