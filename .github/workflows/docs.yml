name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Doxygen
        run: sudo apt-get install -y doxygen

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs
        run: pip install mkdocs-material

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build documentation
        run: make docs

      # ── WASM live demo ──────────────────────────────────────
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.51'

      - name: Add Rust WASM target
        run: rustup target add wasm32-unknown-emscripten

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: '0.15.2'

      - name: Build and deploy WASM examples
        run: |
          COMMON="sim/dashboard/app.js sim/dashboard/style.css sim/dashboard/coi-serviceworker.js"
          BUILT=""
          FAILED=""

          for defconfig in defconfigs/wasm/posix/wasm_posix_*_defconfig; do
            # Extract app name: wasm_posix_example_c_defconfig → example_c
            name=$(basename "$defconfig" | sed 's/wasm_posix_//' | sed 's/_defconfig//')

            # Skip Zig — Zig 0.15.x doesn't support wasm32-emscripten yet
            case "$name" in *_zig) echo "Skipping $name (Zig wasm32-emscripten not supported in Zig 0.15)"; continue;; esac
            echo ""
            echo "========================================="
            echo "Building: $name"
            echo "========================================="

            BUILD_DIR="output/wasm/posix/${name}/build/firmware"

            # Clean this workspace's build
            rm -rf "$BUILD_DIR"

            # Configure + download + build (don't fail the whole job)
            if make "wasm_posix_${name}_defconfig" && \
               make configure && \
               make download && \
               make; then
              # Copy artifacts from the known build directory
              if [ -f "$BUILD_DIR/ove_wasm.wasm" ]; then
                mkdir -p "docs-site/site/$name"
                cp "$BUILD_DIR/ove_wasm.html" "docs-site/site/$name/index.html"
                cp "$BUILD_DIR/ove_wasm.js" "docs-site/site/$name/"
                cp "$BUILD_DIR/ove_wasm.wasm" "docs-site/site/$name/"
                cp "$BUILD_DIR/ove_wasm.worker.js" "docs-site/site/$name/" 2>/dev/null || true
                for f in $COMMON; do cp "$f" "docs-site/site/$name/"; done
                BUILT="$BUILT $name"
                echo "✓ $name built successfully"
              else
                FAILED="$FAILED $name"
                echo "✗ $name: build output not found"
              fi
            else
              FAILED="$FAILED $name"
              echo "✗ $name: build failed (continuing)"
            fi
          done

          echo ""
          echo "========================================="
          echo "Summary:"
          echo "  Built:  $BUILT"
          echo "  Failed: ${FAILED:-none}"
          echo "========================================="

          # Generate gallery index page
          cat > docs-site/site/examples.html << 'GALLERY_EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>oveRTOS WASM Examples</title>
            <style>
              body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
              h1 { color: #333; }
              .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
              .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; text-decoration: none; color: #333; }
              .card:hover { border-color: #4ecca3; background: #f8f8f8; }
              .card h3 { margin: 0 0 8px 0; }
              .card p { margin: 0; font-size: 14px; color: #666; }
            </style>
          </head>
          <body>
            <h1>oveRTOS WASM Examples</h1>
            <p>Interactive demos running entirely in the browser via WebAssembly.</p>
            <div class="grid" id="apps"></div>
            <script>
          GALLERY_EOF

          # Add links for each built app
          echo "      var apps = [" >> docs-site/site/examples.html
          for name in $BUILT; do
            lang=$(echo "$name" | grep -oE '(cpp|rust|zig)$' || echo "c")
            app=$(echo "$name" | sed "s/_${lang}$//" | sed 's/_c$//')
            echo "        {name:'$name', app:'$app', lang:'$lang'}," >> docs-site/site/examples.html
          done
          cat >> docs-site/site/examples.html << 'GALLERY_EOF2'
              ];
              var grid = document.getElementById('apps');
              apps.forEach(function(a) {
                var card = document.createElement('a');
                card.className = 'card';
                card.href = a.name + '/';
                card.innerHTML = '<h3>' + a.app + '</h3><p>' + a.lang.toUpperCase() + '</p>';
                grid.appendChild(card);
              });
            </script>
          </body>
          </html>
          GALLERY_EOF2

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/site

  deploy:
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
