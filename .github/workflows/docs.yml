name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Doxygen
        run: sudo apt-get install -y doxygen

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs
        run: pip install mkdocs-material

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build documentation
        run: make docs

      # ── WASM live demo ──────────────────────────────────────
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.51'

      - name: Build WASM demo
        run: |
          make wasm_posix_example_c_defconfig
          make configure
          make download
          make

      - name: Add WASM demo to docs site
        run: |
          mkdir -p docs-site/site/demo
          cp output/wasm/posix/example_c/build/firmware/ove_wasm.html docs-site/site/demo/index.html
          cp output/wasm/posix/example_c/build/firmware/ove_wasm.js docs-site/site/demo/
          cp output/wasm/posix/example_c/build/firmware/ove_wasm.wasm docs-site/site/demo/
          cp sim/dashboard/app.js docs-site/site/demo/
          cp sim/dashboard/style.css docs-site/site/demo/
          # coi-serviceworker.js for SharedArrayBuffer (Emscripten pthreads)
          python3 -c "
          sw = open('docs-site/site/demo/coi-serviceworker.js', 'w')
          sw.write('''if(typeof window===\"undefined\"){self.addEventListener(\"install\",()=>self.skipWaiting());self.addEventListener(\"activate\",e=>e.waitUntil(self.clients.claim()));self.addEventListener(\"fetch\",e=>{if(e.request.cache===\"only-if-cached\"&&e.request.mode!==\"same-origin\")return;e.respondWith(fetch(e.request).then(r=>{if(r.status===0)return r;const h=new Headers(r.headers);h.set(\"Cross-Origin-Embedder-Policy\",\"require-corp\");h.set(\"Cross-Origin-Opener-Policy\",\"same-origin\");return new Response(r.body,{status:r.status,statusText:r.statusText,headers:h})}).catch(e=>console.error(e)))})}else{(async()=>{if(window.crossOriginIsolated!==false)return;const r=await navigator.serviceWorker.register(window.document.currentScript.src);if(r.active&&!navigator.serviceWorker.controller)window.location.reload();else if(!r.active)r.addEventListener(\"updatefound\",()=>r.installing.addEventListener(\"statechange\",()=>{if(r.installing.state===\"activated\")window.location.reload()}))})()}''')
          sw.close()
          "

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/site

  deploy:
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
