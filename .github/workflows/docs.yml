name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Doxygen
        run: sudo apt-get install -y doxygen

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs
        run: pip install mkdocs-material

      - name: Setup Rust (stable, for `make docs`)
        # rust-src is required by rust-toolchain.toml and must be installed
        # up-front via this action.  If it isn't, rustup tries to add it on
        # the fly when `cargo doc` first runs and conflicts with the
        # GitHub runner's pre-staged Rust install
        # (lib/rustlib/src/rust/library/Cargo.lock already exists), aborting
        # the whole job.  Same pattern as ove-tests.yml::test-rust.
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src

      - name: Build documentation
        run: make docs

      # ── Live demos ──────────────────────────────────────────
      # The example apps run in the browser as the real FreeRTOS firmware
      # for the QEMU MPS2-AN500, inside QEMU compiled to WebAssembly.
      - name: Install demo build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            cmake build-essential gcc-arm-none-eabi libnewlib-arm-none-eabi meson ninja-build \
            libclang-dev xz-utils qemu-system-arm

      - name: Cache ARM toolchain
        uses: actions/cache@v4
        with:
          path: output/toolchains
          key: arm-toolchain-${{ hashFiles('manifest.yaml') }}

      # Building the emulator takes a while (a container image with its
      # dependencies, then QEMU itself); it only changes with the pinned
      # QEMU version or the build recipe.
      - name: Cache the WebAssembly QEMU
        uses: actions/cache@v4
        with:
          path: output/tools/qemu-wasm
          key: qemu-wasm-${{ hashFiles('manifest.yaml', 'config/scripts/build-qemu-wasm.sh', 'config/qemu-wasm/mps2.mak') }}

      - name: Build the WebAssembly QEMU
        run: .venv/bin/ove ensure-toolchain qemu-wasm

      - name: Build and deploy the browser demos
        run: |
          # Every app that supports the 'web' variant; an app that fails
          # to build only drops its own demo.
          make allconfigs-web.freertos || true

          EMULATOR=$(ls -d output/tools/qemu-wasm/qemu-*/ | head -1)
          mkdir -p docs-site/site/qemu
          cp "$EMULATOR/qemu-system-arm.wasm" "$EMULATOR/SOURCE.txt" docs-site/site/qemu/

          BUILT=""
          BROKEN=""
          for serve in output/web/freertos/*/serve; do
            [ -f "$serve/firmware.elf" ] || continue
            name=$(basename "$(dirname "$serve")")
            # Only publish a demo whose firmware comes up under the native
            # QEMU: a page for an app that faults at start-up helps no one.
            if ! config/scripts/qemu-smoke.sh "$(dirname "$serve")/images/firmware.elf"; then
              BROKEN="$BROKEN $name"
              continue
            fi
            dest="docs-site/site/$name"
            mkdir -p "$dest/qemu"
            for f in index.html app.js style.css coi-serviceworker.js qemu-wasm.js firmware.elf; do
              cp "$serve/$f" "$dest/"
            done
            # The emulator's script has to sit below the page (its worker
            # threads reload it, and the service worker only isolates the
            # page's own directory); the 26 MB binary is shared.
            cp "$EMULATOR/qemu-system-arm.js" "$dest/qemu/"
            printf '%s\n' '{ "firmware": "firmware.elf", "emulator": "qemu/", "wasm": "../qemu/qemu-system-arm.wasm", "machine": "mps2-an500" }' > "$dest/web.json"
            BUILT="$BUILT $name"
          done

          echo ""
          echo "========================================="
          echo "Deployed demos:$BUILT"
          echo "Not deployed (failed the smoke run):${BROKEN:- none}"
          echo "========================================="

          # Gallery index page, from each deployed app's app.yaml.
          .venv/bin/python - $BUILT > docs-site/site/examples.html << 'GALLERY_EOF'
          import glob
          import html
          import sys

          import yaml

          apps = {}
          for path in glob.glob("apps/**/app.yaml", recursive=True):
              with open(path) as f:
                  app = yaml.safe_load(f)
              apps[app["config_name"]] = app

          LANGS = {"c": "C", "cpp": "C++", "rust": "Rust", "zig": "Zig"}
          cards = []
          for name in sorted(sys.argv[1:]):
              app = apps.get(name, {})
              title = html.escape(app.get("description", name))
              lang = LANGS.get(app.get("lang", "c"), "C")
              cards.append(f'<a class="card" href="{name}/"><h3>{title}</h3>'
                           f"<p>{lang} &middot; <code>{name}</code></p></a>")

          print(f"""<!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>oveRTOS Browser Examples</title>
            <style>
              body {{ font-family: sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; }}
              h1 {{ color: #333; }}
              .grid {{ display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }}
              .card {{ border: 1px solid #ddd; border-radius: 8px; padding: 16px; text-decoration: none; color: #333; }}
              .card:hover {{ border-color: #4ecca3; background: #f8f8f8; }}
              .card h3 {{ margin: 0 0 8px 0; font-size: 16px; }}
              .card p {{ margin: 0; font-size: 14px; color: #666; }}
            </style>
          </head>
          <body>
            <h1>oveRTOS Browser Examples</h1>
            <p>Each demo is the FreeRTOS firmware of that example for the QEMU
            MPS2-AN500, running in QEMU compiled to WebAssembly.</p>
            <div class="grid">
            {chr(10).join(cards)}
            </div>
          </body>
          </html>""")
          GALLERY_EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/site

  deploy:
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
