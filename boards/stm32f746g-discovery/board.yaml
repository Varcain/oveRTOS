board:
  name: stm32f746g-discovery
  mcu_family: stm32f7
  mcu: STM32F746xx

clock:
  hse_freq_mhz: 25
  sysclk_mhz: 216
  ahb_div: 1
  apb1_div: 4
  apb2_div: 2

memory:
  flash_kb: 1024
  ram_kb: 320
  dtcm_kb: 64
  sdram_kb: 8192
  sdram_start: "0xC0000000"

gpio:
  port_count: 9
  pins_per_port: 16

leds:
  - port: 8
    pin: 1
    active_low: false

audio:
  i2s:
    sample_rate: 44100
    bit_depth: 16
    channels: 1
    buffer_samples: 512
  codec:
    type: WM8994
    i2c_addr: "0x34"

display:
  width: 480
  height: 272
  color_format: RGB565

serial:
  console:
    baud: 115200
    tx_pin: PA9
    rx_pin: PB7
    rx_buffer_size: 1024

sdcard:
  interface: SDMMC1

watchdog:
  timeout_ms: 5000

defconfig:
  - CONFIG_OVE_TOOLCHAIN_DOWNLOAD=y
  - CONFIG_OVE_RUST_TOOLCHAIN_SYSTEM=y

rtos_defconfig:
  freertos:
    - CONFIG_FREERTOS_TOTAL_HEAP_SIZE=131072
    # The Linux personality embeds the BusyBox rootfs.cpio into the 1 MB internal flash. The
    # dynamic FDPIC userspace fits (firmware ~53 KB + ~865 KB cpio = ~916 KB of 1 MB) and is
    # used: FDPIC shares the read-only program text in-place from flash — one copy for every
    # process — which bFLT cannot. Verified booting + interactive on real silicon. Harmless for
    # non-personality apps (the var depends on OVE_LINUX).
    - CONFIG_OVE_LINUX_ROOTFS_OUTPUT="output-fdpic"
    # Real hardware needs bsp_boardInit() to run (clock + FMC external SDRAM + the MPU region
    # that makes that SDRAM executable & non-cacheable for the program pool). That init only
    # runs when OVE_BOARD is enabled (ove_app_run -> ove_board_init). Required on silicon.
    - CONFIG_OVE_BOARD=y
  nuttx:
    # NuttX brings its OWN STM32F746 board init (clock + FMC external SDRAM via CONFIG_STM32F7_FMC,
    # USART1 console), so it does NOT use oveRTOS's bsp_boardInit (CONFIG_OVE_BOARD is FreeRTOS-only).
    # The program runs PRIVILEGED here (no per-task MPU isolation — that's a follow-up); the seam
    # places the program pool at a fixed external-SDRAM address past the LTDC framebuffer.
    - CONFIG_OVE_LINUX_ROOTFS_OUTPUT="output-fdpic"
  zephyr:
    # Zephyr runs the program UNPRIVILEGED in per-task MPU domains (K_USER). The Zephyr-side knobs
    # (USERSPACE, the FMC SDRAM memc node + the OVE_PROG_RAM NOLOAD region, USART1 console) live in
    # the prj.conf template + the board overlay; here only the oveRTOS rootfs selector is needed.
    - CONFIG_OVE_LINUX_ROOTFS_OUTPUT="output-fdpic"
