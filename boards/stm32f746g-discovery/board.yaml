board:
  name: stm32f746g-discovery
  mcu_family: stm32f7
  mcu: STM32F746xx

clock:
  hse_freq_mhz: 25
  sysclk_mhz: 216
  ahb_div: 1
  apb1_div: 4
  apb2_div: 2

memory:
  flash_kb: 1024
  ram_kb: 320
  dtcm_kb: 64
  sdram_kb: 8192
  sdram_start: "0xC0000000"

gpio:
  port_count: 9
  pins_per_port: 16

leds:
  - port: 8
    pin: 1
    active_low: false

audio:
  i2s:
    sample_rate: 44100
    bit_depth: 16
    channels: 1
    buffer_samples: 512
  codec:
    type: WM8994
    i2c_addr: "0x34"

display:
  width: 480
  height: 272
  color_format: RGB565

serial:
  console:
    baud: 115200
    tx_pin: PA9
    rx_pin: PB7
    rx_buffer_size: 1024

sdcard:
  interface: SDMMC1

watchdog:
  timeout_ms: 5000

defconfig:
  - CONFIG_OVE_TOOLCHAIN_DOWNLOAD=y
  - CONFIG_OVE_RUST_TOOLCHAIN_SYSTEM=y

rtos_defconfig:
  freertos:
    - CONFIG_FREERTOS_TOTAL_HEAP_SIZE=131072
    - CONFIG_OVE_LINUX_ROOTFS_OUTPUT="output-fdpic"
    # The Linux personality runs its rootfs from the on-board QSPI NOR (N25Q128A, 16 MB),
    # memory-mapped + XIP'd at 0x90000000: the FDPIC userspace with LVGL is ~1.45 MB — far past
    # the 1 MB internal flash — and FDPIC shares the read-only program text in-place from the
    # cpio (one copy per process, which bFLT cannot). The firmware then holds only itself
    # (~250 KB); the rootfs is programmed separately with OpenOCD stmqspi (flash-qspi.sh).
    # ROOTFS_QSPI depends on OVE_LINUX so it is inert for non-personality F746 apps; OVE_QSPI
    # just mem-maps the NOR.
    - CONFIG_OVE_QSPI=y
    - CONFIG_OVE_LINUX_ROOTFS_QSPI=y
    # Real capacitive touch: the FT5336 is on I2C3 (ove_i2c instance 2) on the Disco. The Linux
    # personality's evdev class polls it into /dev/input/event0; it takes precedence over the
    # QEMU synthetic testpad (inert for the personality unless OVE_LINUX_DEV_INPUT is on).
    - CONFIG_OVE_FT5336=y
    - CONFIG_OVE_FT5336_I2C_INSTANCE=2
    # Real hardware needs bsp_boardInit() to run (clock + FMC external SDRAM + the MPU region
    # that makes that SDRAM executable & non-cacheable for the program pool). That init only
    # runs when OVE_BOARD is enabled (ove_app_run -> ove_board_init). Required on silicon.
    - CONFIG_OVE_BOARD=y
  nuttx:
    # NuttX brings its OWN STM32F746 clock + FMC external SDRAM + USART1 console. The program runs
    # UNPRIVILEGED behind an MPU view the seam programs raw (nuttx_lnx_trap.c: ove_lnx_mpu_init +
    # per-switch note driver). LVGL rootfs in QSPI: the FDPIC userspace is ~1.45 MB, past the 1 MB
    # internal flash, so XIP it from the on-board N25Q NOR at 0x90000000 (boards/.../nuttx/src/
    # board_init.c memory-maps it + adds the FMC read-pipe fix from ove_hal_board_init, which
    # OVE_BOARD wires into ove_app_run before the personality parses the rootfs). The rootfs is
    # programmed to the NOR separately with OpenOCD stmqspi (flash-qspi.sh). ove_lnx_mpu_init
    # adds a static RO+X region for the 0x90000000 window so the unprivileged guest can XIP its
    # text.
    - CONFIG_OVE_LINUX_ROOTFS_OUTPUT="output-fdpic"
    - CONFIG_OVE_LINUX_ROOTFS_QSPI=y
    - CONFIG_OVE_BOARD=y
  zephyr:
    # Zephyr runs the program UNPRIVILEGED in per-task MPU domains (K_USER). The Zephyr-side knobs
    # (USERSPACE, the FMC SDRAM memc node + the OVE_PROG_RAM NOLOAD region, USART1 console) live in
    # the prj.conf template + the board overlay. LVGL rootfs in QSPI: the ~1.45 MB FDPIC userspace
    # is XIP'd from the on-board N25Q NOR at 0x90000000 (CONFIG_STM32_MEMMAP auto-maps it; the
    # ove-linux-fb.overlay retypes that window RO+X for the guest domain). Programmed separately
    # with OpenOCD stmqspi (flash-qspi.sh). Frees the internal flash for the firmware.
    - CONFIG_OVE_LINUX_ROOTFS_OUTPUT="output-fdpic"
    - CONFIG_OVE_LINUX_ROOTFS_QSPI=y
