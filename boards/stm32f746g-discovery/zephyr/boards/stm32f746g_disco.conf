CONFIG_I2S=y
CONFIG_I2C=y
CONFIG_DMA=y
CONFIG_AUDIO=y
CONFIG_AUDIO_CODEC=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVERS=y
CONFIG_DISK_DRIVER_SDMMC=y
# Keep each DMA transfer to one 512-byte sector in an owned staging buffer.
# This avoids the STM32F7 HAL multiblock stop-command state machine without
# exposing caller cache lines to DMA.
CONFIG_SDMMC_STM32_SINGLE_BLOCK=y
CONFIG_DISPLAY=y
CONFIG_HEAP_MEM_POOL_SIZE=20480
# Auto-generated by board_tool.py -- END

# Keep a private 512-byte FatFs data window per open file to avoid repeatedly
# recycling the volume cache under SQLite. Store the resulting FIL pool in
# CPU-only DTCM; the SDMMC driver owns a separate DMA-safe staging buffer.
CONFIG_FS_FATFS_TINY=n
CONFIG_FS_FATFS_FILE_POOL_DTCM=y

