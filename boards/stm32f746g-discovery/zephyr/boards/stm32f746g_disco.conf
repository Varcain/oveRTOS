CONFIG_I2S=y
CONFIG_I2C=y
# CONFIG_USERSPACE shifts final device objects by eight bytes after Zephyr has
# generated its static ISR arguments (the Ethernet driver has the same board
# workaround in patches/). Use the STM32 driver's supported polling path so an
# I2C event cannot dereference the stale device pointer.
CONFIG_I2C_STM32_INTERRUPT=n
CONFIG_DMA=y
CONFIG_AUDIO=y
CONFIG_AUDIO_CODEC=y

CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_MAIN_STACK_SIZE=8192

# Zephyr's userspace kobject gperf table varies with absolute object addresses.
# Fifty percent covers every supported profile (the worst observed final table
# was 1.23x its prebuilt estimate) without letting the default 100% reserve push
# BSS across an MPU alignment boundary. The linker fails closed on overflow.
CONFIG_KOBJECT_DATA_AREA_RESERVE_EXTRA_PERCENT=50

CONFIG_LOG=y
CONFIG_I2S_LOG_LEVEL_DBG=y
CONFIG_SDMMC_LOG_LEVEL_DBG=y
CONFIG_DISK_LOG_LEVEL_DBG=y
