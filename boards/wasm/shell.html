<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>oveRTOS Browser Simulation</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/winbox@0.2.82/dist/css/winbox.min.css"/>
    <link rel="stylesheet" href="style.css">
    <script src="coi-serviceworker.js"></script>
</head>
<body>
    <header>
        <h1>oveRTOS Simulation Dashboard</h1>
        <div class="header-right">
            <button id="reset-layout" class="btn btn-small" title="Reset window layout">Reset Layout</button>
            <div id="status" class="status">Loading WASM...</div>
        </div>
    </header>

    <!-- Panels start hidden; WinBox mount() moves them into windows -->
    <div id="panel-store" style="display:none">
        <section class="panel" id="display-panel">
            <div class="display-container">
                <canvas id="display-canvas"></canvas>
            </div>
            <div class="display-info">
                <span id="display-resolution">--</span>
                <span id="display-fps">-- FPS</span>
            </div>
        </section>

        <section class="panel" id="audio-panel">
            <div class="audio-controls">
                <button id="audio-play-toggle" class="btn">Enable Playback</button>
                <button id="audio-mic-toggle" class="btn">Enable Mic</button>
                <span id="audio-info">--</span>
            </div>
            <div class="audio-devices">
                <label>Output: <select id="audio-output-select" class="btn"></select></label>
                <label>Input: <select id="audio-input-select" class="btn"></select></label>
            </div>
            <div class="waveform-pair">
                <div class="waveform-box">
                    <span class="waveform-label">INPUT</span>
                    <canvas id="waveform-input" height="80"></canvas>
                </div>
                <div class="waveform-box">
                    <span class="waveform-label">OUTPUT</span>
                    <canvas id="waveform-output" height="80"></canvas>
                </div>
            </div>
        </section>

        <section class="panel" id="console-panel">
            <div style="display:flex;gap:8px;">
                <input type="text" id="console-input" class="btn"
                       style="flex:1;font-family:inherit;font-size:12px;padding:6px 8px;"
                       placeholder="Type command + Enter...">
                <button id="console-send" class="btn">Send</button>
            </div>
        </section>

        <section class="panel" id="events-panel">
            <div class="events-toolbar">
                <button id="autoscroll-toggle" class="btn btn-small autoscroll-on" title="Toggle auto-scroll">Auto-scroll: ON</button>
            </div>
            <div id="event-log" class="event-log"></div>
        </section>
    </div>

    <!--
      Guard: if SharedArrayBuffer isn't available yet (service worker
      hasn't activated), show a message and don't load Emscripten.
      The coi-serviceworker.js will reload the page automatically.
    -->
    <script>
    if (typeof SharedArrayBuffer === 'undefined') {
        document.getElementById('status').textContent =
            'Activating service worker... (page will reload)';
        /* Block Emscripten from loading by defining Module as a no-op. */
        window.__skip_emscripten = true;
    }
    </script>

    <!--
      Pre-define Module BEFORE Emscripten JS loads.
      This lets us hook onRuntimeInitialized and set up frame polling.
    -->
    <script>
    if (window.__skip_emscripten) {
        /* SharedArrayBuffer not available yet — service worker is
         * activating.  Page will auto-reload.  Don't load Emscripten. */
        var Module = { noInitialRun: true };
    } else {

    var Module = {
        /* Log any print/err from the WASM module to the event log. */
        print: function(text) {
            console.log(text);
            if (typeof addEvent === 'function') {
                addEvent('wasm', text);
            } else {
                var log = document.getElementById('event-log');
                if (log) {
                    var el = document.createElement('div');
                    el.className = 'entry';
                    el.textContent = '[wasm] ' + text;
                    log.appendChild(el);
                }
            }
        },
        printErr: function(text) {
            console.error(text);
            if (text.indexOf('keepRuntimeAlive') !== -1) return;
            if (text.indexOf('program exited (with status: 0)') !== -1) return;
            if (typeof addEvent === 'function') {
                addEvent('err', text);
            } else {
                var log = document.getElementById('event-log');
                if (log) {
                    var el = document.createElement('div');
                    el.className = 'entry';
                    el.innerHTML = '<span class="type">[err]</span> ' + text;
                    log.appendChild(el);
                }
            }
        },
        onAbort: function(what) {
            document.getElementById('status').textContent = 'WASM Aborted: ' + what;
            document.getElementById('status').className = 'status disconnected';
        },
        onRuntimeInitialized: function() {
            document.getElementById('status').textContent = 'Connected (WASM)';
            document.getElementById('status').className = 'status connected';

            /* Create WinBox windows for panels enabled by compile-time config. */
            if (window.createDashboardWindow) {
                if (Module.ccall('ove_wasm_has_lvgl', 'number'))
                    window.createDashboardWindow('display', 'Display');
                if (Module.ccall('ove_wasm_has_audio', 'number'))
                    window.createDashboardWindow('audio', 'Audio');
                if (Module.ccall('ove_wasm_has_shell', 'number'))
                    window.createDashboardWindow('console', 'Console');
                window.createDashboardWindow('events', 'Events');
            }

            /* Start polling the shared framebuffer in WASM heap. */
            var lastSeq = 0;
            var canvas = document.getElementById('display-canvas');
            var ctx2d = canvas.getContext('2d');
            var resEl = document.getElementById('display-resolution');
            var fpsEl = document.getElementById('display-fps');
            var frames = 0;
            var lastFpsTime = performance.now();

            function pollFrame() {
                requestAnimationFrame(pollFrame);

                var seq = Module.ccall('ove_wasm_fb_get_seq', 'number');
                if (seq === lastSeq) return;
                lastSeq = seq;

                var w = Module.ccall('ove_wasm_fb_get_width', 'number');
                var h = Module.ccall('ove_wasm_fb_get_height', 'number');
                var size = Module.ccall('ove_wasm_fb_get_size', 'number');
                if (w === 0 || h === 0 || size === 0) return;

                if (canvas.width !== w || canvas.height !== h) {
                    canvas.width = w;
                    canvas.height = h;
                    resEl.textContent = w + 'x' + h;
                }

                /* Read XRGB8888 pixels directly from WASM heap. */
                var pxPtr = Module.ccall('ove_wasm_fb_get_pixels', 'number');
                var src = new Uint8Array(Module.HEAPU8.buffer, pxPtr, size);
                var imgData = ctx2d.createImageData(w, h);
                var dst = imgData.data;

                /* XRGB8888 (BGRA in little-endian) -> RGBA. */
                for (var i = 0; i < w * h; i++) {
                    var off = i * 4;
                    dst[off]     = src[off + 2]; /* R */
                    dst[off + 1] = src[off + 1]; /* G */
                    dst[off + 2] = src[off];     /* B */
                    dst[off + 3] = 255;          /* A */
                }
                ctx2d.putImageData(imgData, 0, 0);

                frames++;
                var now = performance.now();
                if (now - lastFpsTime >= 1000) {
                    fpsEl.textContent = frames + ' FPS';
                    frames = 0;
                    lastFpsTime = now;
                }
            }
            pollFrame();

            /* ── Mouse/touch input forwarding to LVGL ──────────── */
            canvas.addEventListener('mousedown', function(e) {
                var r = canvas.getBoundingClientRect();
                var sx = canvas.width / r.width;
                var sy = canvas.height / r.height;
                Module.ccall('ove_wasm_input_set', null,
                    ['number','number','number'],
                    [Math.round((e.clientX - r.left) * sx),
                     Math.round((e.clientY - r.top) * sy), 1]);
                e.preventDefault();
            });
            canvas.addEventListener('mouseup', function(e) {
                var r = canvas.getBoundingClientRect();
                var sx = canvas.width / r.width;
                var sy = canvas.height / r.height;
                Module.ccall('ove_wasm_input_set', null,
                    ['number','number','number'],
                    [Math.round((e.clientX - r.left) * sx),
                     Math.round((e.clientY - r.top) * sy), 0]);
            });
            canvas.addEventListener('mousemove', function(e) {
                if (!(e.buttons & 1)) return;
                var r = canvas.getBoundingClientRect();
                var sx = canvas.width / r.width;
                var sy = canvas.height / r.height;
                Module.ccall('ove_wasm_input_set', null,
                    ['number','number','number'],
                    [Math.round((e.clientX - r.left) * sx),
                     Math.round((e.clientY - r.top) * sy), 1]);
            });
            /* Touch support */
            canvas.addEventListener('touchstart', function(e) {
                var t = e.touches[0];
                var r = canvas.getBoundingClientRect();
                var sx = canvas.width / r.width;
                var sy = canvas.height / r.height;
                Module.ccall('ove_wasm_input_set', null,
                    ['number','number','number'],
                    [Math.round((t.clientX - r.left) * sx),
                     Math.round((t.clientY - r.top) * sy), 1]);
                e.preventDefault();
            }, {passive: false});
            canvas.addEventListener('touchend', function(e) {
                Module.ccall('ove_wasm_input_set', null,
                    ['number','number','number'], [0, 0, 0]);
                e.preventDefault();
            }, {passive: false});
            canvas.addEventListener('touchmove', function(e) {
                var t = e.touches[0];
                var r = canvas.getBoundingClientRect();
                var sx = canvas.width / r.width;
                var sy = canvas.height / r.height;
                Module.ccall('ove_wasm_input_set', null,
                    ['number','number','number'],
                    [Math.round((t.clientX - r.left) * sx),
                     Math.round((t.clientY - r.top) * sy), 1]);
                e.preventDefault();
            }, {passive: false});

            /* ── Console input ─────────────────────────────────── */
            var conInput = document.getElementById('console-input');
            var conSend = document.getElementById('console-send');
            function sendConsole() {
                var text = conInput.value + '\n';
                for (var i = 0; i < text.length; i++) {
                    Module.ccall('ove_wasm_console_push', null,
                        ['number'], [text.charCodeAt(i)]);
                }
                conInput.value = '';
            }
            conSend.addEventListener('click', sendConsole);
            conInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') sendConsole();
            });

            /* ── Audio: playback via ScriptProcessorNode ───────── */
            /* (AudioWorklet requires a separate .js file served
             *  with correct headers; ScriptProcessorNode is simpler
             *  and works inline for simulation purposes.) */

            var audioCtx = null;
            var playbackNode = null;
            var captureStream = null;
            var captureNode = null;
            var RING_SIZE = 16384;
            var RING_HDR = 16; /* write_pos(4) + read_pos(4) + rate(4) + ch(2) + bits(2) */

            /** Draw a float32 waveform on a canvas. */
            function drawWave(ctx, cvs, samples, color) {
                if (!ctx) return;
                var cw = cvs.width || cvs.clientWidth;
                var ch = cvs.height;
                if (cw <= 0) { cw = cvs.clientWidth; cvs.width = cw; }
                ctx.fillStyle = '#0d1117';
                ctx.fillRect(0, 0, cw, ch);
                var step = Math.max(1, Math.floor(samples.length / cw));
                ctx.strokeStyle = color;
                ctx.lineWidth = 1;
                ctx.beginPath();
                for (var x = 0; x < cw && x * step < samples.length; x++) {
                    var y = (1 - samples[x * step]) * ch / 2;
                    if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }
            var outSelect = document.getElementById('audio-output-select');
            var inSelect = document.getElementById('audio-input-select');

            /* ── Enumerate audio devices ─────────────────────────── */
            function refreshDevices() {
                navigator.mediaDevices.enumerateDevices().then(function(devs) {
                    outSelect.innerHTML = '';
                    inSelect.innerHTML = '';
                    var oi = 0, ii = 0;
                    devs.forEach(function(d) {
                        var opt = document.createElement('option');
                        opt.value = d.deviceId;
                        if (d.kind === 'audiooutput') {
                            opt.textContent = d.label || ('Speaker ' + (++oi));
                            outSelect.appendChild(opt);
                        } else if (d.kind === 'audioinput') {
                            opt.textContent = d.label || ('Microphone ' + (++ii));
                            inSelect.appendChild(opt);
                        }
                    });
                });
            }
            refreshDevices();
            navigator.mediaDevices.addEventListener('devicechange', refreshDevices);

            /* Switch output device on running AudioContext. */
            outSelect.addEventListener('change', function() {
                if (audioCtx && audioCtx.setSinkId) {
                    audioCtx.setSinkId(outSelect.value);
                }
            });

            document.getElementById('audio-play-toggle').addEventListener('click', function() {
                if (playbackNode) {
                    playbackNode.disconnect();
                    playbackNode = null;
                    audioCtx.close();
                    audioCtx = null;
                    this.textContent = 'Enable Playback';
                    return;
                }

                var pbPtr = Module.ccall('ove_wasm_audio_get_playback_ptr', 'number');
                var heap32 = Module.HEAPU32 || new Uint32Array(Module.HEAPU8.buffer);
                var sampleRate = heap32[(pbPtr + 8) >> 2] || 16000;

                audioCtx = new AudioContext({ sampleRate: sampleRate });
                if (audioCtx.setSinkId && outSelect.value) {
                    audioCtx.setSinkId(outSelect.value);
                }

                var wpOff = pbPtr;
                var rpOff = pbPtr + 4;
                var bufOff = pbPtr + RING_HDR;

                /* ScriptProcessorNode pulls audio at render rate */
                var outCanvas = document.getElementById('waveform-output');
                var outCtx = outCanvas ? outCanvas.getContext('2d') : null;

                playbackNode = audioCtx.createScriptProcessor(1024, 0, 1);
                playbackNode.onaudioprocess = function(e) {
                    var output = e.outputBuffer.getChannelData(0);
                    var heap32 = Module.HEAPU32 || new Uint32Array(Module.HEAPU8.buffer);
                    var heap8 = Module.HEAPU8;
                    var wp = Atomics.load(heap32, wpOff >> 2);
                    var rp = Atomics.load(heap32, rpOff >> 2);
                    var avail = wp - rp;
                    var bytesNeeded = output.length * 2; /* 16-bit mono */

                    for (var i = 0; i < output.length; i++) {
                        if (i * 2 < avail) {
                            var idx = bufOff + ((rp + i * 2) & (RING_SIZE - 1));
                            var lo = heap8[idx];
                            var hi = heap8[idx + 1];
                            var sample = (hi << 8) | lo;
                            if (sample > 32767) sample -= 65536;
                            output[i] = sample / 32768.0;
                        } else {
                            output[i] = 0;
                        }
                    }
                    var consumed = Math.min(avail, bytesNeeded);
                    Atomics.store(heap32, rpOff >> 2, rp + consumed);

                    drawWave(outCtx, outCanvas, output, '#e94560');
                };
                playbackNode.connect(audioCtx.destination);
                this.textContent = 'Disable Playback';
                document.getElementById('audio-info').textContent =
                    sampleRate + ' Hz / mono / 16bit';
            });

            /* ── Audio: capture via getUserMedia ───────────────── */
            document.getElementById('audio-mic-toggle').addEventListener('click', function() {
                if (captureNode) {
                    captureNode.disconnect();
                    captureNode = null;
                    if (captureStream) {
                        captureStream.getTracks().forEach(function(t) { t.stop(); });
                        captureStream = null;
                    }
                    this.textContent = 'Enable Mic';
                    return;
                }

                var self = this;
                var constraints = { audio: inSelect.value ? { deviceId: { exact: inSelect.value } } : true };
                navigator.mediaDevices.getUserMedia(constraints).then(function(stream) {
                    captureStream = stream;

                    var capPtr = Module.ccall('ove_wasm_audio_get_capture_ptr', 'number');
                    var tmpHeap32 = Module.HEAPU32 || new Uint32Array(Module.HEAPU8.buffer);
                    var appRate = tmpHeap32[(capPtr + 8) >> 2] || 16000;

                    if (!audioCtx) audioCtx = new AudioContext({ sampleRate: appRate });

                    var wpOff = capPtr;
                    var rpOff = capPtr + 4;
                    var bufOff = capPtr + RING_HDR;

                    var source = audioCtx.createMediaStreamSource(stream);
                    captureNode = audioCtx.createScriptProcessor(1024, 1, 1);
                    var inCanvas = document.getElementById('waveform-input');
                    var inCtx = inCanvas ? inCanvas.getContext('2d') : null;

                    captureNode.onaudioprocess = function(e) {
                        var input = e.inputBuffer.getChannelData(0);
                        var heap32 = Module.HEAPU32 || new Uint32Array(Module.HEAPU8.buffer);
                        var heap8 = Module.HEAPU8;
                        var wp = Atomics.load(heap32, wpOff >> 2);
                        var rp = Atomics.load(heap32, rpOff >> 2);
                        var free = RING_SIZE - (wp - rp);

                        var bytesToWrite = Math.min(input.length * 2, free);
                        var samplesToWrite = bytesToWrite >> 1;

                        for (var i = 0; i < samplesToWrite; i++) {
                            var s = Math.max(-1, Math.min(1, input[i]));
                            var val = (s < 0 ? s * 32768 : s * 32767) | 0;
                            var idx = bufOff + ((wp + i * 2) & (RING_SIZE - 1));
                            heap8[idx] = val & 0xFF;
                            heap8[idx + 1] = (val >> 8) & 0xFF;
                        }
                        Atomics.store(heap32, wpOff >> 2, wp + samplesToWrite * 2);

                        drawWave(inCtx, inCanvas, input, '#4ecca3');
                    };
                    source.connect(captureNode);
                    captureNode.connect(audioCtx.destination);
                    self.textContent = 'Disable Mic';
                }).catch(function(err) {
                    console.error('Mic access denied:', err);
                });
            });
        }
    };

    } /* end else (SharedArrayBuffer available) */
    </script>

    <!-- WinBox floating window manager -->
    <script src="https://cdn.jsdelivr.net/npm/winbox@0.2.82/dist/js/winbox.min.js"></script>
    <!-- Dashboard JS (event log, window layout, etc.) -->
    <script src="app.js"></script>

    <!-- Emscripten-generated JS (uses the pre-defined Module) -->
    {{{ SCRIPT }}}
</body>
</html>
