board:
  name: qemu-mps2-an500
  mcu_family: arm
  mcu: CMSDK_CM7
  symbol: OVE_BOARD_QEMU_MPS2_AN500
  title: QEMU MPS2-AN500 (Cortex-M7)
  description: |
    ARM MPS2-AN500 board emulated by QEMU (Cortex-M7).
    Uses semihosting for I/O and sim dashboard for display
    (the Linux personality build is headless — semihosting console only).
  kconfig: |
    # The Linux personality is headless: no sim framework, trace stream, or
    # profiler (all of which pull the sim display transport). Normal an500
    # builds keep the sim dashboard.
    select OVE_SIM if !OVE_LINUX
    # Debug by default, for the dashboard's debugger.  The browser bundle
    # runs under an interpreter and wants the optimised build instead.
    imply OVE_DEBUG_BUILD if !OVE_SIM_WEB

rtos:
  freertos: {}
  nuttx:
    board: mps2-an500
    config: nsh
  zephyr:
    board: mps2/an500

clock:
  hse_freq_mhz: 25
  sysclk_mhz: 25

memory:
  flash_kb: 4096
  ram_kb: 4096

gpio:
  port_count: 8
  pins_per_port: 16

leds: []

display:
  width: 480
  height: 272
  color_format: RGB565

audio:
  i2s:
    sample_rate: 16000
    bit_depth: 16
    channels: 1
    buffer_samples: 512

serial:
  console:
    instance: CMSDK_UART0
    baud: 115200
    rx_buffer_size: 1024

# `make web.<rtos>.<app>`: this board packaged for a web browser.
variants:
  web:
    - CONFIG_OVE_SIM_WEB=y

rtos_defconfig:
  freertos:
    - CONFIG_OVE_RUST_TARGET="thumbv7em-none-eabihf"
  nuttx:
    - CONFIG_OVE_RUST_TARGET="thumbv7em-none-eabihf"
  zephyr:
    - CONFIG_OVE_RUST_TARGET="thumbv7em-none-eabi"
    - CONFIG_ZEPHYR_HEAP_MEM_POOL_SIZE=1572864
    - "# CONFIG_ZEPHYR_I2S is not set"
    - "# CONFIG_ZEPHYR_CMSIS_DSP is not set"
    - "# CONFIG_ZEPHYR_SD_FILESYSTEM is not set"
