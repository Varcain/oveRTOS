board:
  name: qemu-mps2-an500
  mcu_family: arm
  mcu: CMSDK_CM7

clock:
  hse_freq_mhz: 25
  sysclk_mhz: 25
  ahb_div: 1
  apb1_div: 1
  apb2_div: 1

memory:
  flash_kb: 4096
  ram_kb: 4096

gpio:
  port_count: 8
  pins_per_port: 16

leds: []

display:
  width: 480
  height: 272
  color_format: RGB565

audio:
  i2s:
    sample_rate: 16000
    bit_depth: 16
    channels: 1
    buffer_samples: 512

serial:
  console:
    baud: 115200
    tx_pin: none
    rx_pin: none
    rx_buffer_size: 1024

watchdog:
  timeout_ms: 5000

defconfig:
  - CONFIG_OVE_TOOLCHAIN_DOWNLOAD=y
  - CONFIG_OVE_RUST_TOOLCHAIN_SYSTEM=y

rtos_defconfig:
  freertos:
    - CONFIG_OVE_RUST_TARGET="thumbv7em-none-eabihf"
  nuttx:
    - CONFIG_OVE_RUST_TARGET="thumbv7em-none-eabihf"
  zephyr:
    - CONFIG_OVE_RUST_TARGET="thumbv7em-none-eabi"
    - CONFIG_ZEPHYR_HEAP_MEM_POOL_SIZE=1572864
    - "# CONFIG_ZEPHYR_I2S is not set"
    - "# CONFIG_ZEPHYR_CMSIS_DSP is not set"
    - "# CONFIG_ZEPHYR_SD_FILESYSTEM is not set"
