site_name: oveRTOS Documentation
site_url: https://varcain.github.io/oveRTOS/
site_description: RTOS framework — unified build system, configuration, and API for FreeRTOS, NuttX, Zephyr, and POSIX
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - content.code.copy
  palette:
    - scheme: slate
      primary: indigo
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
plugins:
  - search
nav:
  - Home: index.md
  - Getting Started:
    - Overview: getting-started/overview.md
    - Setup: getting-started/setup.md
    - Configure: getting-started/configure.md
    - Build: getting-started/build.md
    - Run: getting-started/run.md
  - API Reference:
    - Overview: api/index.md
    - Threads: api/threads.md
    - Synchronization: api/sync.md
    - IPC (Queue, Events, Stream): api/ipc.md
    - Timers & Work Queues: api/timers.md
    - Audio Engine: api/audio.md
    - Filesystem: api/fs.md
    - Hardware I/O: api/io.md
    - UART: api/uart.md
    - SPI: api/spi.md
    - I2C: api/i2c.md
    - I2S: api/i2s.md
    - Shell & Console: api/shell.md
    - Non-Volatile Storage: api/nvs.md
    - ML Inference: api/infer.md
    - Networking: api/net.md
    - Power Management: api/pm.md
  - Build System:
    - CMake: build-system/cmake.md
    - Kconfig: build-system/kconfig.md
    - Boards: build-system/boards.md
    - External Apps: build-system/external-apps.md
    - Simulation: build-system/sim.md
  - Backends: backends/index.md
  - Examples:
    - Overview: examples/index.md
    - Basic Example:
      - Overview: examples/example/index.md
      - C: examples/example/c.md
      - C++: examples/example/cpp.md
      - Rust: examples/example/rust.md
      - Zig: examples/example/zig.md
    - Benchmark:
      - Overview: examples/benchmark/index.md
      - C: examples/benchmark/c.md
      - C++: examples/benchmark/cpp.md
      - Rust: examples/benchmark/rust.md
      - Zig: examples/benchmark/zig.md
    - Networking:
      - Overview: examples/example_net/index.md
      - C: examples/example_net/c.md
      - C++: examples/example_net/cpp.md
      - Rust: examples/example_net/rust.md
      - Zig: examples/example_net/zig.md
    - Power Management:
      - Overview: examples/example_pm/index.md
      - C: examples/example_pm/c.md
      - C++: examples/example_pm/cpp.md
      - Rust: examples/example_pm/rust.md
      - Zig: examples/example_pm/zig.md
    - Keyword Detection:
      - Overview: examples/example_keyword_live/index.md
      - C: examples/example_keyword_live/c.md
      - C++: examples/example_keyword_live/cpp.md
      - Rust: examples/example_keyword_live/rust.md
      - Zig: examples/example_keyword_live/zig.md
