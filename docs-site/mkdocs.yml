site_name: oveRTOS Documentation
site_url: https://varcain.github.io/oveRTOS/
site_description: RTOS framework — unified build system, configuration, and API for FreeRTOS, NuttX, Zephyr, and POSIX
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - content.code.copy
  palette:
    - scheme: slate
      primary: indigo
markdown_extensions:
  # `attr_list` enables the `{:attr="value"}` syntax appended to inline
  # markdown elements — used by example pages to add target="_blank" to
  # external WASM-demo links so they open in a new tab instead of
  # navigating away from the docs.
  - attr_list
  # `md_in_html` lets Markdown be parsed inside HTML blocks — used by
  # the homepage card grid (`<div class="grid cards" markdown>`).
  - md_in_html
  # `admonition` enables `!!! note / !!! tip` callout blocks used on the
  # homepage and quickstart.
  - admonition
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
plugins:
  - search
