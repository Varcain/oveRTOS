[package]
name = "ove"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"

[features]
default = ["panic-handler"]
std = ["alloc"]
# `alloc` enables `ove::alloc` re-exports (Arc, Box, Vec, String) and the
# closure-capable `Thread::spawn_with`.  Apps that want these on no_std
# bare-metal targets must also pull in `ove-allocator` (or supply their
# own `#[global_allocator]`).
alloc = []
panic-handler = []
# `embedded-hal` activates the `embedded_hal::*` trait impls on
# `ove::I2c` / `ove::Spi` / `ove::Delay` / `ove::gpio::OutputPin` /
# `ove::gpio::InputPin`.  Optional because not every consumer wants the
# upstream crate in their dep tree (e.g. host-only test rigs); enabling
# unlocks any `embedded-hal`-aware sensor driver from crates.io.
embedded-hal = ["dep:embedded-hal"]
# `embedded-io` activates the `embedded_io::*` trait impls on
# `ove::Uart` / `ove::Stream` / `ove::fs::File`.  Separate from
# `embedded-hal` so callers can pick exactly what they need.
embedded-io = ["dep:embedded-io"]
# `embedded-io-async` activates async `Read` trait impls on the
# `AsyncUart` / `AsyncStream` wrappers. Requires the `async` feature
# and pulls in the sync `embedded-io` impls (the async trait extends
# `embedded_io::ErrorType` defined there).
embedded-io-async = ["dep:embedded-io-async", "embedded-io", "async"]
# `embedded-hal-async` activates async `SpiBus` / `I2c` trait impls on
# `AsyncSpi` / `AsyncI2c`. Requires `async` and pulls in sync
# `embedded-hal` impls (the async traits extend `embedded_hal::*::ErrorType`).
embedded-hal-async = ["dep:embedded-hal-async", "embedded-hal", "async"]
# `portable-atomic-arc` swaps `alloc::sync::Arc` for
# `portable_atomic_util::Arc`. Same API; the alternative impl falls
# back to a critical-section path on targets without native 64-bit
# atomic CAS (M0+, RV32 without A). Current oveRTOS targets all have
# CAS so this is a future-proofing toggle, not a workaround for
# anything we ship today. Re-exported as `ove::Arc`.
portable-atomic-arc = ["dep:portable-atomic-util", "alloc"]
# `fugit` adds unit-safe `Duration` and `Instant` types alongside the
# default `core::time::Duration` API. Useful when you want the compiler
# to catch `from_secs(10)` vs `from_millis(10)` mix-ups; the existing
# `core::time::Duration` API is unchanged for callers who don't enable
# this feature.
fugit = ["dep:fugit"]
# `async-net` activates the embassy-net async IP stack module. Requires
# `async` and a transport sub-feature. Mutually exclusive with the
# blocking `ove::net` (C-side `CONFIG_OVE_ASYNC_NET` and `CONFIG_OVE_NET`
# don't both compile in — the build picks one).
async-net = ["dep:embassy-net", "dep:embassy-net-driver", "async"]
# Transport: shared-memory ring on QEMU MPS2-AN500 (semihosting bridge).
# Pulls in C-side `boards/qemu-mps2-an500/src/qemu_net_async.c` and
# requires `CONFIG_OVE_ASYNC_NET=y` in the build config.
async-net-qemu-shm = ["async-net"]
# Transport: STM32F7 ETH MAC + LAN8742A PHY (stm32f746g-discovery).
# Pulls in C-side `drivers/freertos/stm32f7/stm32f7_eth_async.c` and
# requires `CONFIG_OVE_ASYNC_NET=y`.
async-net-stm32f7-eth = ["async-net"]
# `async` activates the Embassy-based async runtime hosted on the
# oveRTOS C substrate. Requires the C side to be built with
# `CONFIG_OVE_ASYNC=y` (build.rs detects this and emits
# `cfg(has_async)`); users who turn on the feature without configuring
# the C side get a clear compile error from the cfg gate.
#
# The runtime uses our own [`Executor`](async_runtime::Executor) that
# wraps `embassy_executor::raw::Executor` and blocks on
# `ove_event_wait` between polls — this yields cleanly to the
# FreeRTOS / Zephyr / NuttX scheduler instead of spinning on WFE or
# parking a host thread. No `embassy-executor` arch feature is
# selected; our `__pender` symbol replaces the upstream one.
#
# Our `critical-section::Impl` is backed by `ove_irq_lock` /
# `ove_irq_unlock` on every target (POSIX falls through to a pthread
# mutex via `ove_irq_lock`'s POSIX impl). `restore-state-u64` matches
# `ove_irq_key_t`.
async = [
    "dep:embassy-executor",
    "dep:embassy-time",
    "dep:embassy-time-driver",
    "dep:embassy-time-queue-utils",
    "dep:embassy-sync",
    "dep:critical-section",
    "critical-section/restore-state-u64",
]
# Back-compat aliases — all collapse to `async`. The arch is no longer
# user-selectable because our run loop uses `ove_event_wait` instead of
# arch-specific wait primitives.
async-arch-std = ["async"]
async-arch-cortex-m = ["async"]
async-arch-spin = ["async"]

[dependencies]
# Fixed-capacity, no_std container library — `ove::containers::*` re-exports
# `Vec`, `String`, `Deque`, `IndexMap`, `IndexSet`, `LinearMap`, `HistoryBuf`
# and assorted lock-free queues.  Works in both heap and zeroheap modes
# without `cfg` gating because heapless never touches a global allocator —
# capacity is a const generic and storage is owned in the type.
heapless = { version = "0.9", default-features = false }
# Companion proc-macro crate (`#[ove::main]`).  Pinned to a path dep in
# the workspace; published in lockstep with `ove`.
ove-macros = { path = "../ove-macros", version = "0.1" }
# `log` is the de-facto facade for diagnostic logging in the Rust
# ecosystem.  Non-optional: every meaningful embedded crate
# (`embassy-*`, `defmt-rtt` competitors, sensor drivers) depends on it,
# so making it optional would just push the dep up to apps.  The
# `log::Log` backend is provided by `ove::log` and routes records to
# `ove_console_write` via the existing `FmtBuf` stack-buffer machinery
# — no alloc dep added.
log = "0.4"
# `embedded-hal` traits — opt-in via the `embedded-hal` feature.  See
# the feature comment for rationale.
embedded-hal = { version = "1.0", optional = true }
# `embedded-io` traits — opt-in via the `embedded-io` feature. Pinned
# to 0.7 because the optional `embedded-io-async` feature depends on
# `embedded-io-async = "0.7"`, which itself depends on `embedded-io =
# "0.7"`. Cargo can't unify 0.6 + 0.7 — they're separate ABI majors.
embedded-io = { version = "0.7", optional = true }
# `embedded-io-async` traits — opt-in via the `embedded-io-async`
# feature (which also pulls in the sync `embedded-io` impls since
# the async trait extends the sync `ErrorType`).
embedded-io-async = { version = "0.7", optional = true }
# `embedded-hal-async` traits — opt-in via the `embedded-hal-async`
# feature. Pinned to 1.0 alongside `embedded-hal`.
embedded-hal-async = { version = "1.0", optional = true }
# `portable-atomic-util` — alternative `Arc` impl for targets without
# native CAS. Opt-in via `portable-atomic-arc`.
portable-atomic-util = { version = "0.2", default-features = false, features = ["alloc"], optional = true }
# `fugit` — unit-safe `Duration`/`Instant` types. Opt-in via the
# `fugit` feature.
fugit = { version = "0.3", default-features = false, optional = true }
# `embassy-net` — async TCP/IP stack (smoltcp-backed). Pulled in by the
# `async-net` feature. Pinned to 0.7; bumps validated by a per-backend
# loopback integration test as upstream-bump gate.
embassy-net = { version = "0.6", default-features = false, features = ["proto-ipv4", "tcp", "udp", "dhcpv4", "dns", "medium-ethernet"], optional = true }
# `embassy-net-driver` — Driver trait we implement per board.
embassy-net-driver = { version = "0.2", default-features = false, optional = true }
# Embassy substrate — all opt-in via the `async` feature.  See the
# feature documentation for arch selection.  Versions pinned to a
# minor; bumps are intentional and validated by an integration test
# (one task waiting on a timer) per backend.
embassy-executor = { version = "0.7", default-features = false, optional = true }
embassy-time = { version = "0.4", default-features = false, features = ["tick-hz-1_000_000"], optional = true }
embassy-time-driver = { version = "0.2", default-features = false, optional = true }
embassy-time-queue-utils = { version = "0.1", default-features = false, optional = true }
embassy-sync = { version = "0.7", default-features = false, optional = true }
# Arch-feature gating selects the right restore-state width:
#  - async-arch-std    → critical-section/std (transitively, restore-state-bool)
#  - async-arch-cortex-m / -spin → critical-section/restore-state-u64
# Exactly one is enabled at any time; mixing them is a compile error
# inside the critical-section crate.
critical-section = { version = "1.2", default-features = false, optional = true }

[build-dependencies]
bindgen = "0.72"

[package.metadata.docs.rs]
features = ["std"]
rustdoc-args = ["--cfg", "docsrs"]

# Release profile tuned for the embedded target surface that drives this
# binding (Cortex-M, no-unwind, size-conscious).  Defaults give
# lto=false / codegen-units=16 / panic=unwind, which leaves Rust-side
# inlining off and keeps the panic-unwind machinery in the ELF — neither
# of those make sense when the C side is compiled `-Os` with abort-on-fault.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = "s"
strip = "symbols"
overflow-checks = false
